<template>
  <section class="follow-page" aria-label="Authors I follow">
    <div class="follow-header">
      <div>
        <p class="eyebrow">Personalized releases</p>
        <h2>Authors I follow</h2>
        <p>Keep up with new books from authors you love.</p>
      </div>
      <button type="button" class="refresh" onclick={refresh}>Refresh</button>
    </div>
    <template if:true={error}
      ><div class="error" role="alert">{error}</div></template
    >
    <template if:true={hasRows}>
      <div class="follow-list">
        <template for:each={rows} for:item="row">
          <article class="follow-card" key={row.id}>
            <span class="author-mark" aria-hidden="true">✦</span>
            <div class="author-copy">
              <h3>{row.authorName}</h3>
              <span>Following since {row.followedAt}</span>
            </div>
            <button
              class="remove"
              type="button"
              data-id={row.id}
              onclick={remove}
            >
              Unfollow
            </button>
          </article>
        </template>
      </div>
    </template>
    <template if:false={hasRows}
      ><div class="empty">
        You are not following any authors yet. Follow one from a book’s details.
      </div></template
    >
  </section>
</template>
