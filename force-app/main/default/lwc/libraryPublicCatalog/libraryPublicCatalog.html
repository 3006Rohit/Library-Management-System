<template>
  <div class="page">
    <div class="frame">
      <c-library-auth-nav></c-library-auth-nav>

      <header class="hero">
        <span class="badge">▥ Explore Books</span>
        <h1>Discover Your Next Great Read</h1>
        <p>
          Browse the full catalog by title, author or category. Log in to borrow
          and reserve.
        </p>
        <div class="search-row">
          <input
            aria-label="Search catalog"
            placeholder="Search by title, author, ISBN, category, or publisher..."
            value={query}
            oninput={handleQuery}
            onkeydown={handleKeydown}
          />
          <button type="button" onclick={loadBooks}>Search</button>
        </div>
      </header>

      <p class="result-count">{resultLabel}</p>

      <template if:true={loading}>
        <lightning-spinner
          alternative-text="Loading books"
          size="medium"
        ></lightning-spinner>
      </template>
      <template if:true={errorMessage}>
        <div class="message error" role="alert">{errorMessage}</div>
      </template>

      <template if:true={hasBooks}>
        <div class="book-grid">
          <template for:each={books} for:item="book">
            <article class="book-card" key={book.id}>
              <div class="cover-wrap">
                <template if:true={book.coverUrl}>
                  <img src={book.coverUrl} alt={book.title} />
                </template>
                <template if:false={book.coverUrl}>
                  <div class="cover-placeholder">▥</div>
                </template>
              </div>
              <div class="book-copy">
                <h2>{book.title}</h2>
                <p class="author">{book.authors}</p>
                <span class="category">{book.categories}</span>
                <p class="publisher">{book.publisher}{book.yearLabel}</p>
                <span class={book.availabilityClass}>
                  <i></i>{book.availabilityLabel}
                </span>
                <a class="borrow" href="/library/login">Log in to borrow</a>
              </div>
            </article>
          </template>
        </div>
      </template>
      <template if:false={loading}>
        <template if:false={hasBooks}>
          <div class="message">No books match your search.</div>
        </template>
      </template>
    </div>
  </div>
</template>
