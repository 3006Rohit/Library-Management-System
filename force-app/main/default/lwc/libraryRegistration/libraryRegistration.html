<template>
    <lightning-card title="Library membership application" icon-name="standard:contact">
        <div class="slds-p-around_medium">
            <template lwc:if={submitted}>
                <div class="slds-notify slds-notify_alert slds-theme_success" role="status">{successMessage}</div>
            </template>
            <template lwc:else>
                <form onsubmit={handleSubmit} novalidate>
                    <div class="slds-grid slds-wrap slds-gutters_small">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><lightning-input name="firstName" data-field="firstName" label="First Name" required onchange={handleChange}></lightning-input></div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><lightning-input name="lastName" data-field="lastName" label="Last Name" required onchange={handleChange}></lightning-input></div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><lightning-input name="email" data-field="email" type="email" label="Email" required onchange={handleChange}></lightning-input></div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><lightning-input name="phone" data-field="phone" type="tel" label="Phone" pattern="[+0-9() .-]{7,25}" message-when-pattern-mismatch="Enter a valid phone number." onchange={handleChange}></lightning-input></div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><lightning-input name="dateOfBirth" data-field="dateOfBirth" type="date" label="Date of Birth" max={today} onchange={handleChange}></lightning-input></div>
                        <div class="slds-col slds-size_1-of-1"><lightning-textarea name="address" data-field="address" label="Address" onchange={handleChange}></lightning-textarea></div>
                        <div class="slds-col slds-size_1-of-1"><lightning-combobox name="requestedPlanId" data-field="requestedPlanId" label="Requested Membership Plan" options={planOptions} required onchange={handleChange}></lightning-combobox></div>
                    </div>
                    <template lwc:if={errorMessage}><div class="slds-text-color_error slds-m-top_small" role="alert">{errorMessage}</div></template>
                    <div class="slds-m-top_medium"><lightning-button type="submit" variant="brand" label="Submit application" disabled={loading}></lightning-button><template lwc:if={loading}><lightning-spinner alternative-text="Submitting application" size="small"></lightning-spinner></template></div>
                </form>
            </template>
        </div>
    </lightning-card>
</template>
