<template>
    <div class="member-app">
        <aside class="sidebar">
            <div class="brand"><span class="brand-mark">▥</span><span>Library Management System</span></div>
            <button class="mobile-menu-button" aria-label="Toggle navigation" onclick={toggleMobileNav}>☰</button><nav class={mobileNavClass}>
                <template for:each={navItems} for:item="item">
                    <button key={item.value} class={item.cssClass} data-section={item.value} onclick={goTo}>{item.label}</button>
                </template>
            </nav>
            <div class="sidebar-footer">Member access<br/><span>Secure Experience Cloud portal</span></div>
        </aside>

        <main class="workspace">
            <header class="topbar">
                <div class="mobile-brand"><span class="brand-mark">▥</span> Library</div>
                <div class="topbar-spacer"></div><button class="notification-button" aria-label="Notifications" onclick={toggleMenu}>♧<template if:true={alertCount}><span class="notification-count">{alertCount}</span></template></button>
                <div class="member-chip"><span class="avatar">{initials}</span><span><strong>{displayName}</strong><small>{membershipStatus} member</small></span><button class="menu-toggle" aria-label="Open account menu" onclick={toggleMenu}>⌄</button><div class={menuClass}><button data-section="Profile" onclick={goTo}>Profile</button><button data-section="Membership" onclick={goTo}>Membership</button><button onclick={logout}>Logout</button></div></div>
                <button class="logout-button" onclick={logout}>Logout</button>
            </header>

            <section class="content">
                <div class="page-heading"><div><p class="eyebrow">MEMBER PORTAL</p><h1>Welcome, {displayName}</h1><p class="date-line">Your personal library dashboard</p></div></div>
                <template if:true={loading}><lightning-spinner alternative-text="Loading member data"></lightning-spinner></template>
                <template if:true={error}><div class="diagnostic-error">{error}<button class="secondary-button retry-button" onclick={retry}>Try again</button></div></template>

                <template if:true={isHome}><template if:true={isHomeReady}>
                    <div class="metric-grid">
                        <button class="metric-card metric-button" data-section="My Borrowings" onclick={openMetric}><span class="metric-icon">▣</span><div><small>Active Loans</small><strong>{dashboard.activeLoans}</strong><em>Currently borrowed</em></div></button>
                        <button class="metric-card metric-button" data-section="My Borrowings" onclick={openMetric}><span class="metric-icon">◷</span><div><small>Due Soon</small><strong>{dashboard.dueSoon}</strong><em>Next due date</em></div></button>
                        <button class="metric-card metric-button" data-section="My Borrowings" onclick={openMetric}><span class="metric-icon warning">!</span><div><small>Overdue Books</small><strong class="danger-number">{dashboard.overdueLoans}</strong><em>Action required</em></div></button>
                        <button class="metric-card metric-button" data-section="My Reservations" onclick={openMetric}><span class="metric-icon">♧</span><div><small>Reservations</small><strong>{dashboard.activeReservations}</strong><em>Pending or ready</em></div></button>
                    </div>
                    <template if:true={alertCount}><div class="alert-strip"><strong>Important updates</strong><span><template if:true={hasOverdueLoans}>{overdueLoans.length} overdue loan(s). </template><template if:true={hasDueSoonLoans}>{dueSoonLoans.length} loan(s) due within 3 days. </template><template if:true={outstandingFine}>Outstanding balance: {outstandingFine}. </template></span><button class="text-button" data-section="My Borrowings" onclick={selectSection}>Review now</button></div></template>
                    <div class="quick-actions"><button class="primary-button" data-section="Catalog" onclick={selectSection}>Browse catalog</button><button class="secondary-button" data-section="My Borrowings" onclick={selectSection}>View borrowings</button><button class="secondary-button" data-section="My Reservations" onclick={selectSection}>My reservations</button><button class="secondary-button" data-section="Profile" onclick={selectSection}>Update profile</button></div>
                    <div class="dashboard-grid">
                        <section class="panel"><div class="panel-heading"><h2>Current borrowings</h2><button class="text-button" data-section="My Borrowings" onclick={selectSection}>View all</button></div><template for:each={activeLoans} for:item="loan"><div class="data-row" key={loan.Id}><span><strong>{loan.bookName}</strong><small>Due {loan.Due_Date__c}</small></span><span class="status-pill">{loan.Status__c}</span></div></template><template if:false={hasActiveLoans}><p class="empty-state">You have no active loans.</p></template></section>
                        <section class="panel membership-card"><div class="panel-heading"><h2>Membership</h2><button class="text-button" data-section="Membership" onclick={selectSection}>Details</button></div><template if:true={hasPlan}><div class="plan-name">{planName}</div><p>Valid until <strong>{member.Membership_End_Date__c}</strong></p><div class="plan-stats"><span>Borrow limit <b>{borrowLimit}</b></span><span>Loan period <b>{loanDurationDays} days</b></span></div></template><template if:false={hasPlan}><p class="empty-state">Plan information unavailable.</p></template></section>
                    </div>
                    <div class="dashboard-grid lower-grid"><section class="panel"><div class="panel-heading"><h2>Due soon and overdue</h2><button class="text-button" data-section="My Borrowings" onclick={selectSection}>Manage loans</button></div><template if:true={hasOverdueLoans}><template for:each={overdueLoans} for:item="loan"><div class="data-row compact-row" key={loan.Id}><span><strong>{loan.bookName}</strong><small>Overdue · Due {loan.Due_Date__c}</small></span><span class="status-pill danger-pill">Overdue</span></div></template></template><template if:true={hasDueSoonLoans}><template for:each={dueSoonLoans} for:item="loan"><div class="data-row compact-row" key={loan.Id}><span><strong>{loan.bookName}</strong><small>Due {loan.Due_Date__c}</small></span><span class="status-pill warning-pill">Due soon</span></div></template></template><template if:false={hasOverdueLoans}><template if:false={hasDueSoonLoans}><p class="empty-state">No loans need attention right now.</p></template></template></section><section class="panel"><div class="panel-heading"><h2>Reservation updates</h2><button class="text-button" data-section="My Reservations" onclick={selectSection}>View all</button></div><template if:true={hasReservations}><template for:each={upcomingReservations} for:item="reservation"><div class="data-row compact-row" key={reservation.Id}><span><strong>{reservation.bookName}</strong><small>Queue {reservation.Queue_Position__c}</small></span><span class="status-pill">{reservation.Status__c}</span></div></template></template><template if:false={hasReservations}><p class="empty-state">No active reservations.</p></template></section></div>
                    <section class="panel discovery-panel"><div class="panel-heading"><h2>Discover books</h2><button class="text-button" data-section="Catalog" onclick={selectSection}>Explore catalog</button></div><p class="discovery-copy">Find your next read from the library collection.</p><template for:each={catalog} for:item="book"><article class="discovery-card" key={book.Id}><div class="mini-cover">▥</div><div><strong>{book.Name}</strong><small>{book.authors} · {book.availabilityLabel}</small></div><button class="text-button" data-id={book.Id} onclick={openBook}>Details</button></article></template></section>
                    <template if:true={outstandingFine}><div class="notice warning-notice">Outstanding fine balance: {outstandingFine}</div></template>
                </template></template>

                <template if:true={isCatalog}><section class="panel section-panel"><div class="panel-heading"><h2>Book catalog</h2><span class="catalog-count">{catalogCountLabel}</span></div><div class="filter-bar catalog-filters"><lightning-input name="searchTerm" label="Search title, ISBN, or author" value={searchTerm} onchange={handleInput}></lightning-input><lightning-combobox name="categoryId" label="Category" value={categoryId} options={categoryOptions} onchange={handleInput}></lightning-combobox><lightning-combobox name="availability" label="Availability" value={availability} options={availabilityOptions} onchange={handleInput}></lightning-combobox><button class="primary-button" onclick={searchNow}>Search</button><button class="secondary-button" onclick={clearCatalogFilters}>Clear</button></div><template if:true={hasCatalogResults}><div class="catalog-grid"><template for:each={catalog} for:item="book"><article class="book-card" key={book.Id}><div class="book-cover">▥</div><h3>{book.Name}</h3><p>{book.authors}</p><p>{book.categories}</p><span class={book.availabilityClass}>{book.availabilityLabel}</span><button class="secondary-button" data-id={book.Id} onclick={openBook}>View details</button></article></template></div></template><template if:false={hasCatalogResults}><p class="empty-state catalog-empty">No books matched your filters. Try clearing the search or selecting another category.</p></template><div class="pager"><button class="secondary-button" onclick={previousCatalog} disabled={isFirstCatalogPage}>Previous</button><span>Page {catalogPage}</span><button class="secondary-button" onclick={nextCatalog}>Next</button></div></section><template if:true={bookDetail}><section class="panel detail-panel"><div class="panel-heading"><h2>{bookDetail.Name}</h2><button class="text-button" onclick={closeBookDetails}>Close</button></div><p>{bookDetail.ISBN__c} · {bookDetail.Publisher__c} · {bookDetail.Language__c}</p><p>{bookDetail.Description__c}</p><p><strong>{bookDetail.Available_Copies__c}</strong> of {bookDetail.Total_Copies__c} copies currently available</p><button class="primary-button" onclick={reserveSelected}>Reserve book</button></section></template></template>

                <template if:true={isBorrowings}><section class="panel section-panel"><div class="panel-heading"><h2>My borrowings</h2></div><h3 class="subheading">Active and overdue loans</h3><template for:each={activeLoans} for:item="loan"><div class="data-row" key={loan.Id}><span><strong>{loan.bookName}</strong><small>Copy {loan.barcode} · Due {loan.Due_Date__c} · Renewals {loan.Renewal_Count__c}</small></span><span><span class="status-pill">{loan.Status__c}</span><button class="secondary-button compact" data-id={loan.Id} onclick={renew}>Renew</button></span></div></template><h3 class="subheading">Borrowing history</h3><template for:each={historyLoans} for:item="loan"><div class="data-row" key={loan.Id}><span><strong>{loan.bookName}</strong><small>Borrowed {loan.Borrow_Date__c} · Returned {loan.Return_Date__c}</small></span><span class="status-pill">{loan.Status__c}</span></div></template></section></template>

                <template if:true={isReservations}><section class="panel section-panel"><div class="panel-heading"><h2>My reservations</h2></div><template for:each={reservations} for:item="reservation"><div class="data-row" key={reservation.Id}><span><strong>{reservation.bookName}</strong><small>Queue position {reservation.Queue_Position__c} · Ready {reservation.Ready_Date__c}</small></span><span><span class="status-pill">{reservation.Status__c}</span><template if:true={reservation.canCancel}><button class="secondary-button compact" data-id={reservation.Id} onclick={cancelReservation}>Cancel</button></template></span></div></template></section></template>

                <template if:true={isFines}><section class="panel section-panel"><div class="panel-heading"><h2>My fines</h2><span class="balance">Balance: {outstandingFine}</span></div><template for:each={fines} for:item="fine"><div class="data-row" key={fine.Id}><span><strong>{fine.borrowBookName}</strong><small>{fine.Fine_Type__c} · Amount {fine.Amount__c} · Paid {fine.Paid_Amount__c}</small></span><span><b>{fine.Balance__c}</b> <span class="status-pill">{fine.Status__c}</span></span></div></template></section></template>

                <template if:true={isMembership}><template if:true={isMembershipReady}><section class="panel section-panel"><div class="panel-heading"><h2>Membership details</h2></div><template if:true={hasPlan}><div class="detail-grid"><div><small>Plan</small><strong>{planName}</strong></div><div><small>Status</small><strong>{membership.Status__c}</strong></div><div><small>Membership period</small><strong>{membership.Membership_Start_Date__c} to {membership.Membership_End_Date__c}</strong></div><div><small>Borrow limit</small><strong>{borrowLimit}</strong></div><div><small>Loan duration</small><strong>{loanDurationDays} days</strong></div><div><small>Reservation limit</small><strong>{reservationLimit}</strong></div><div><small>Renewal limit</small><strong>{renewalLimit}</strong></div><div><small>Fine per day</small><strong>{finePerDay}</strong></div></div></template><template if:false={hasPlan}><p class="empty-state">Plan information unavailable.</p></template></section></template></template>

                <template if:true={isProfile}><template if:true={isProfileReady}><section class="panel section-panel"><div class="panel-heading"><h2>My profile</h2></div><div class="detail-grid"><div><small>Member ID</small><strong>{profile.Name}</strong></div><div><small>Email</small><strong>{profile.Email__c}</strong></div></div><template if:false={editProfile}><div class="profile-summary"><p>{profile.First_Name__c} {profile.Last_Name__c}</p><p>{profile.Phone__c}</p><p>{profile.Address__c}</p></div><button class="primary-button" onclick={beginProfileEdit}>Edit permitted fields</button></template><template if:true={editProfile}><div class="profile-form"><lightning-input name="firstName" label="First Name" value={firstName} onchange={handleInput}></lightning-input><lightning-input name="lastName" label="Last Name" value={lastName} onchange={handleInput}></lightning-input><lightning-input name="phone" label="Phone" value={phone} onchange={handleInput}></lightning-input><lightning-textarea name="address" label="Address" value={address} onchange={handleInput}></lightning-textarea><button class="primary-button" onclick={saveProfile}>Save changes</button></div></template></section></template></template>
            </section>
        </main>
    </div>
</template>
