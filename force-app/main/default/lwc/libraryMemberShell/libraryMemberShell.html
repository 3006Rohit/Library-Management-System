<template>
  <template if:true={showAccessState}>
    <c-library-auth-state
      title={accessStateTitle}
      message={accessStateMessage}
      action-label="Back to Home"
      icon={accessStateIcon}
      variant={accessStateVariant}
      onstateaction={logout}
    ></c-library-auth-state>
  </template>

  <template if:false={showAccessState}>
    <div class={accessibilityClassName}>
      <div class="frame">
        <header class="nav">
          <button
            type="button"
            class="logo"
            data-section="Dashboard"
            onclick={selectSection}
          >
            Library Portal
          </button>
          <button
            type="button"
            class="mobile-menu-button"
            aria-label="Toggle navigation"
            aria-expanded={mobileNavOpen}
            onclick={toggleMobileNav}
          >
            ☰
          </button>
          <nav class={linksClass} aria-label="Member sections">
            <template for:each={navGroups} for:item="group">
              <div
                class="nav-group"
                key={group.label}
                data-group={group.label}
                onfocusout={handleGroupFocusOut}
              >
                <template lwc:if={group.single}>
                  <button
                    type="button"
                    class={group.linkClass}
                    data-section={group.firstSection}
                    onclick={selectSection}
                  >
                    {group.label}
                  </button>
                </template>
                <template lwc:else>
                  <button
                    type="button"
                    class={group.linkClass}
                    aria-haspopup="true"
                    aria-expanded={group.expanded}
                    data-group={group.label}
                    onclick={toggleGroup}
                  >
                    {group.label}<span class="caret" aria-hidden="true">▾</span>
                  </button>
                  <div class={group.menuClass}>
                    <template for:each={group.items} for:item="item">
                      <button
                        type="button"
                        key={item.value}
                        class={item.className}
                        data-section={item.value}
                        onclick={selectSection}
                      >
                        <lightning-icon
                          icon-name={item.icon}
                          size="xx-small"
                        ></lightning-icon
                        ><span>{item.label}</span>
                      </button>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </nav>
          <div class="top-actions">
            <div class="global-search">
              <lightning-icon
                icon-name="utility:search"
                size="x-small"
              ></lightning-icon>
              <input
                aria-label="Search the catalog"
                placeholder="Search books..."
                value={globalSearch}
                oninput={handleGlobalSearch}
              />
            </div>
            <button
              class="icon-button"
              aria-label="Notifications"
              onclick={toggleNotifications}
            >
              <lightning-icon
                icon-name="utility:notification"
                size="x-small"
              ></lightning-icon>
              <template if:true={hasUnreadNotifications}
                ><span class="notification-dot"></span
              ></template>
            </button>
            <div class={notificationPanelClass}>
              <div class="panel-title">
                <strong>Notifications</strong
                ><span>{unreadNotifications.length} unread</span>
              </div>
              <template if:true={hasUnreadNotifications}>
                <template for:each={unreadNotifications} for:item="notice">
                  <button
                    key={notice.Id}
                    class="notice"
                    data-id={notice.Id}
                    onclick={readNotification}
                  >
                    <strong>{notice.Subject__c}</strong
                    ><span>{notice.Message__c}</span>
                  </button>
                </template>
              </template>
              <template if:false={hasUnreadNotifications}
                ><p class="panel-empty">You’re all caught up.</p></template
              >
            </div>
            <button class="account-chip" onclick={toggleAccountMenu}>
              <span class="avatar">{initials}</span
              ><span class="account-copy"
                ><strong>{displayName}</strong><small>{memberId}</small></span
              ><span>⌄</span>
            </button>
            <div class={accountMenuClass}>
              <button data-section="Profile" onclick={selectSection}>
                My Profile
              </button>
              <button data-section="Membership" onclick={selectSection}>
                Membership
              </button>
              <button onclick={logout}>Logout</button>
            </div>
          </div>
        </header>

        <section class="content">
          <template if:true={loading}
            ><lightning-spinner
              alternative-text="Loading member portal"
            ></lightning-spinner
          ></template>
          <template if:true={error}
            ><div class="error-banner">
              <span>{error}</span><button onclick={retry}>Try again</button>
            </div></template
          >
          <template if:true={isReady}>
            <div class="page-heading hero">
              <span class="hero-badge">▥ {section}</span>
              <h1>{pageHeadline}</h1>
              <p>{pageSubtitle}</p>
              <template if:true={isDashboard}>
                <div class="cta">
                  <button
                    type="button"
                    class="button primary large"
                    data-section="Explore Books"
                    onclick={openSection}
                  >
                    Explore books
                  </button>
                  <button
                    type="button"
                    class="button soft large"
                    data-section="My Books"
                    onclick={openSection}
                  >
                    My books
                  </button>
                </div>
              </template>
            </div>

            <template if:true={isDashboard}>
              <section
                class="card member-analytics-panel"
                aria-label="My Library Activity"
              >
                <div class="analytics-panel-header">
                  <div class="analytics-title-lockup">
                    <span class="analytics-panel-icon" aria-hidden="true"
                      >✦</span
                    >
                    <div>
                      <h2>My Library Activity</h2>
                      <p>{memberAnalyticsCadence}</p>
                    </div>
                  </div>
                  <span class="analytics-live-badge"
                    ><span aria-hidden="true"></span>Live</span
                  >
                </div>
                <template if:true={memberAnalyticsAvailable}>
                  <div class="activity-metric-grid">
                    <template for:each={myActivityCards} for:item="metric">
                      <article class={metric.cardClass} key={metric.label}>
                        <span class="activity-metric-icon" aria-hidden="true"
                          >{metric.icon}</span
                        >
                        <div>
                          <strong>{metric.value}</strong
                          ><small>{metric.label}</small>
                        </div>
                      </article>
                    </template>
                  </div>
                </template>
                <template if:false={memberAnalyticsAvailable}>
                  <div class="empty-state compact-empty">
                    {memberAnalyticsMessage}
                  </div>
                </template>
              </section>
              <section
                class="card recommended-panel"
                aria-label="Suggested books"
              >
                <div class="section-title">
                  <div>
                    <h2>Recommended Books</h2>
                    <p>
                      Based on your interests and previous borrowing history
                    </p>
                  </div>
                  <button
                    type="button"
                    data-section="Explore Books"
                    onclick={openSection}
                  >
                    Explore all books
                  </button>
                </div>
                <template if:true={hasRecommendedBooks}>
                  <div class="recommendation-grid">
                    <template for:each={recommendedBooks} for:item="book">
                      <c-library-member-book-card
                        key={book.Id}
                        book={book}
                        onbookaction={openBook}
                      ></c-library-member-book-card>
                    </template>
                  </div>
                </template>
                <template if:false={hasRecommendedBooks}>
                  <div class="empty-state compact-empty">
                    Add interests to your profile or borrow a book to receive
                    personalized suggestions.
                  </div>
                </template>
              </section>
            </template>

            <template if:true={isExploreBooks}>
              <section class="catalog-controls card">
                <div class="catalog-search">
                  <lightning-icon
                    icon-name="utility:search"
                    size="xx-small"
                  ></lightning-icon
                  ><input
                    name="searchTerm"
                    value={searchTerm}
                    oninput={handleInput}
                    onkeydown={handleCatalogKeydown}
                    placeholder="Search by title, author, ISBN..."
                  />
                </div>
                <lightning-combobox
                  variant="label-hidden"
                  aria-label="Category"
                  name="categoryId"
                  value={categoryId}
                  options={categoryOptions}
                  onchange={handleInput}
                ></lightning-combobox>
                <lightning-combobox
                  variant="label-hidden"
                  aria-label="Author"
                  name="authorFilter"
                  value={authorFilter}
                  options={authorOptions}
                  onchange={handleInput}
                ></lightning-combobox>
                <lightning-combobox
                  variant="label-hidden"
                  aria-label="Availability"
                  name="availability"
                  value={availability}
                  options={availabilityOptions}
                  onchange={handleInput}
                ></lightning-combobox>
                <button
                  type="button"
                  class="button primary"
                  onclick={searchNow}
                >
                  Search
                </button>
                <button
                  type="button"
                  class="button outline"
                  onclick={resetCatalog}
                >
                  Reset
                </button>
              </section>
              <div class="category-strip">
                <span>Popular Categories</span
                ><template for:each={popularCategories} for:item="category"
                  ><button
                    key={category.Id}
                    class={category.className}
                    data-id={category.Id}
                    onclick={selectCategory}
                  >
                    {category.Name}
                  </button></template
                >
              </div>
              <template if:true={hasCatalogResults}
                ><div class="book-grid">
                  <template for:each={visibleCatalog} for:item="book"
                    ><c-library-member-book-card
                      key={book.Id}
                      book={book}
                      onbookaction={openBook}
                    ></c-library-member-book-card
                  ></template></div
              ></template>
              <template if:false={hasCatalogResults}
                ><div class="empty-state card">
                  No books match these filters. Try another title, author, or
                  category.
                </div></template
              >
              <div class="pagination">
                <button disabled={isFirstCatalogPage} onclick={previousCatalog}>
                  ‹</button
                ><span>{catalogPage}</span
                ><button onclick={nextCatalog}>›</button>
              </div>
            </template>

            <template if:true={isMyBooks}>
              <div class="tabs">
                <template for:each={loanTabs} for:item="tab"
                  ><button
                    key={tab.value}
                    class={tab.className}
                    data-value={tab.value}
                    onclick={selectLoanTab}
                  >
                    {tab.label}
                  </button></template
                >
              </div>
              <section class="table-card" if:true={isReadingListTab}>
                <template if:true={hasReadingList}
                  ><div class="responsive-table">
                    <table>
                      <thead>
                        <tr>
                          <th>Book</th>
                          <th>Status</th>
                          <th>Updated</th>
                          <th>Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template for:each={readingList} for:item="item"
                          ><tr key={item.id}>
                            <td><strong>{item.bookTitle}</strong></td>
                            <td>{item.state}</td>
                            <td>{item.updatedLabel}</td>
                            <td>
                              <div class="loan-actions">
                                <button
                                  class="button primary compact"
                                  data-id={item.bookId}
                                  onclick={openBook}
                                >
                                  View
                                </button>
                                <button
                                  class="button outline compact"
                                  data-id={item.id}
                                  onclick={removeFromReadingList}
                                >
                                  Remove
                                </button>
                              </div>
                            </td>
                          </tr></template
                        >
                      </tbody>
                    </table>
                  </div></template
                >
                <template if:false={hasReadingList}
                  ><div class="empty-state">
                    Your reading list is empty. Open a book and choose Save to
                    Reading List.
                  </div></template
                >
              </section>
              <section class="table-card" if:true={isFollowedAuthorsTab}>
                <template if:true={hasFollowedAuthors}
                  ><div class="responsive-table">
                    <table>
                      <thead>
                        <tr>
                          <th>Author</th>
                          <th>Followed On</th>
                          <th>Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template for:each={followedAuthors} for:item="author"
                          ><tr key={author.id}>
                            <td><strong>{author.authorName}</strong></td>
                            <td>{author.followedLabel}</td>
                            <td>
                              <button
                                class="button outline compact"
                                data-id={author.id}
                                onclick={unfollowBookAuthor}
                              >
                                Unfollow
                              </button>
                            </td>
                          </tr></template
                        >
                      </tbody>
                    </table>
                  </div></template
                >
                <template if:false={hasFollowedAuthors}
                  ><div class="empty-state">
                    You are not following any authors yet.
                  </div></template
                >
              </section>
              <section class="table-card" if:true={isLoanListTab}>
                <template if:true={hasSelectedLoans}
                  ><div class="responsive-table">
                    <table>
                      <thead>
                        <tr>
                          <th>Book</th>
                          <th>Issue Date</th>
                          <th>Due Date</th>
                          <th>Status</th>
                          <th>Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template for:each={selectedLoans} for:item="loan"
                          ><tr key={loan.Id}>
                            <td>
                              <div class="book-cell">
                                <div class="table-cover">
                                  <template if:true={loan.coverUrl}
                                    ><img src={loan.coverUrl} alt="Book cover"
                                  /></template>
                                </div>
                                <div>
                                  <strong>{loan.bookName}</strong
                                  ><small>{loan.barcode}</small>
                                </div>
                              </div>
                            </td>
                            <td>{loan.issueDateLabel}</td>
                            <td>{loan.dueDateLabel}</td>
                            <td>
                              <span class={loan.statusClass}
                                >{loan.statusLabel}</span
                              >
                            </td>
                            <td>
                              <div class="loan-actions">
                                <button
                                  class="button primary compact"
                                  data-id={loan.Id}
                                  onclick={requestRenew}
                                >
                                  Renew
                                </button>
                                <template if:false={loan.replacementRequired}>
                                  <button
                                    class="button primary compact"
                                    data-id={loan.Id}
                                    onclick={requestDefect}
                                  >
                                    Report problem
                                  </button>
                                </template>
                              </div>
                            </td>
                          </tr></template
                        >
                      </tbody>
                    </table>
                  </div></template
                >
                <template if:false={hasSelectedLoans}
                  ><div class="empty-state">
                    There are no loans in this view.
                  </div></template
                >
              </section>
            </template>

            <template if:true={isReservations}>
              <div class="tabs">
                <template for:each={reservationTabs} for:item="tab"
                  ><button
                    key={tab.value}
                    class={tab.className}
                    data-value={tab.value}
                    onclick={selectReservationTab}
                  >
                    {tab.label}
                  </button></template
                >
              </div>
              <section class="table-card">
                <template if:true={hasSelectedReservations}
                  ><div class="responsive-table">
                    <table>
                      <thead>
                        <tr>
                          <th>Book</th>
                          <th>Reserved On</th>
                          <th>Status</th>
                          <th>Queue Position</th>
                          <th>Estimated Availability</th>
                          <th>Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template
                          for:each={selectedReservations}
                          for:item="reservation"
                          ><tr key={reservation.Id}>
                            <td><strong>{reservation.bookName}</strong></td>
                            <td>{reservation.reservedDateLabel}</td>
                            <td>
                              <span class={reservation.statusClass}
                                >{reservation.statusLabel}</span
                              >
                            </td>
                            <td>{reservation.Queue_Position__c}</td>
                            <td>
                              <strong>{reservation.estimatedDateLabel}</strong>
                              <small title={reservation.etaReason}
                                >{reservation.etaLabel}</small
                              >
                            </td>
                            <td>
                              <template if:true={reservation.canCancel}
                                ><button
                                  class="button danger-outline compact"
                                  data-id={reservation.Id}
                                  onclick={requestCancellation}
                                >
                                  Cancel
                                </button></template
                              >
                            </td>
                          </tr></template
                        >
                      </tbody>
                    </table>
                  </div></template
                >
                <template if:false={hasSelectedReservations}
                  ><div class="empty-state">
                    There are no reservations in this view.
                  </div></template
                >
              </section>
            </template>

            <template if:true={isStudyRooms}>
              <c-library-member-rooms></c-library-member-rooms>
            </template>

            <template if:true={isMemberAssistant}>
              <c-library-member-assistant></c-library-member-assistant>
            </template>

            <template if:true={isMembership}>
              <div class="membership-layout">
                <section class="current-plan card">
                  <p>Current Membership Plan</p>
                  <div class="plan-heading">
                    <span class="plan-crown">♛</span>
                    <div>
                      <h2>{planName}</h2>
                      <small>Full access according to your library plan</small>
                    </div>
                    <span class={memberStatusClass}>{membershipStatus}</span>
                  </div>
                  <div class="plan-validity">
                    Valid till {membershipEndDate}<button
                      class="button primary"
                      onclick={renewMembership}
                    >
                      Renew Plan
                    </button>
                  </div>
                </section>
              </div>
              <div class="benefit-grid">
                <div>
                  <strong>{planBorrowLimit}</strong><span>Book Limit</span>
                </div>
                <div>
                  <strong>{planLoanPeriod} Days</strong><span>Loan Period</span>
                </div>
                <div>
                  <strong>{planReservationLimit}</strong
                  ><span>Priority Reservations</span>
                </div>
                <div>
                  <strong>{planRenewalLimit}</strong><span>Renewals</span>
                </div>
              </div>

              <section class="plans-section" aria-label="Membership plans">
                <div class="plans-head">
                  <span class="hero-badge">▥ Membership plans</span>
                  <h2 class="plans-title">
                    Simple, Transparent Membership For Every Reader
                  </h2>
                  <p>
                    Compare every plan and upgrade whenever you're ready. Your
                    current plan is marked.
                  </p>
                  <div class="toggle" role="group" aria-label="Billing period">
                    <button
                      type="button"
                      class={monthlyTabClass}
                      data-billing="monthly"
                      aria-pressed={isMonthlyBilling}
                      onclick={handleBilling}
                    >
                      Monthly
                    </button>
                    <button
                      type="button"
                      class={annualTabClass}
                      data-billing="annual"
                      aria-pressed={isAnnualBilling}
                      onclick={handleBilling}
                    >
                      Annually
                    </button>
                  </div>
                </div>
                <div class="plan-grid">
                  <template for:each={planCards} for:item="plan">
                    <article key={plan.id} class={plan.className}>
                      <template lwc:if={plan.featured}>
                        <span class="popular">Most popular</span>
                      </template>
                      <p class="plan-name">{plan.name}</p>
                      <div class="plan-price">
                        <strong>{plan.price}</strong><span>{plan.unit}</span>
                      </div>
                      <p class="plan-note">{plan.billedNote}</p>
                      <button
                        type="button"
                        class={plan.buttonClass}
                        data-id={plan.id}
                        disabled={plan.disabled}
                        onclick={requestUpgrade}
                      >
                        {plan.buttonLabel}
                      </button>
                      <p class="plan-includes">Includes:</p>
                      <ul>
                        <template for:each={plan.includes} for:item="item">
                          <li key={item.key}>
                            <span aria-hidden="true">✓</span>{item.text}
                          </li>
                        </template>
                      </ul>
                    </article>
                  </template>
                  <article class="plan">
                    <p class="plan-name">Institutions</p>
                    <div class="plan-price"><strong>Custom</strong></div>
                    <p class="plan-note">Tailored to your organisation</p>
                    <a class="button outline wide" href="/library/contact"
                      >Contact Us</a
                    >
                    <p class="plan-includes">Includes:</p>
                    <ul>
                      <li>
                        <span aria-hidden="true">✓</span>Bulk memberships for
                        groups
                      </li>
                      <li>
                        <span aria-hidden="true">✓</span>Custom borrow and loan
                        limits
                      </li>
                      <li>
                        <span aria-hidden="true">✓</span>Dedicated librarian
                        support
                      </li>
                    </ul>
                  </article>
                </div>
              </section>
            </template>

            <template if:true={isFinesPayments}>
              <div class="finance-summary">
                <section class="summary-card fine">
                  <small>Outstanding Fines</small
                  ><strong>{outstandingFineLabel}</strong
                  ><span>{unpaidFineCount} unpaid fine(s)</span>
                </section>
                <section class="summary-card payments">
                  <small>Payment History</small
                  ><strong>{payments.length}</strong><span>Total payments</span>
                </section>
              </div>
              <div class="tabs">
                <template for:each={fineTabs} for:item="tab"
                  ><button
                    key={tab.value}
                    class={tab.className}
                    data-value={tab.value}
                    onclick={selectFineTab}
                  >
                    {tab.label}
                  </button></template
                >
              </div>
              <section class="table-card">
                <template if:true={hasSelectedFines}
                  ><div class="responsive-table">
                    <table>
                      <thead>
                        <tr>
                          <th>Fine ID</th>
                          <th>Book</th>
                          <th>Amount</th>
                          <th>Balance</th>
                          <th>Reason</th>
                          <th>Date</th>
                          <th>Status</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template for:each={selectedFines} for:item="fine"
                          ><tr key={fine.Id}>
                            <td class="link-cell">{fine.Name}</td>
                            <td>{fine.bookName}</td>
                            <td>{fine.amountLabel}</td>
                            <td>{fine.balanceLabel}</td>
                            <td>{fine.Fine_Type__c}</td>
                            <td>{fine.dateLabel}</td>
                            <td>
                              <span class={fine.statusClass}
                                >{fine.Status__c}</span
                              >
                            </td>
                          </tr></template
                        >
                      </tbody>
                    </table>
                  </div></template
                ><template if:false={hasSelectedFines}
                  ><div class="empty-state">
                    No fines in this view.
                  </div></template
                >
              </section>
              <h2 class="subheading">Payment History</h2>
              <section class="table-card">
                <template if:true={hasPayments}
                  ><div class="responsive-table">
                    <table>
                      <thead>
                        <tr>
                          <th>Payment ID</th>
                          <th>Type</th>
                          <th>Description</th>
                          <th>Amount</th>
                          <th>Date</th>
                          <th>Status</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template for:each={payments} for:item="payment"
                          ><tr key={payment.Id}>
                            <td class="link-cell">{payment.Name}</td>
                            <td>Membership</td>
                            <td>{payment.description}</td>
                            <td>{payment.amountLabel}</td>
                            <td>{payment.dateLabel}</td>
                            <td>
                              <span class={payment.statusClass}
                                >{payment.Status__c}</span
                              >
                            </td>
                          </tr></template
                        >
                      </tbody>
                    </table>
                  </div></template
                ><template if:false={hasPayments}
                  ><div class="empty-state">
                    No payment history is available.
                  </div></template
                >
              </section>
            </template>

            <template if:true={isScanner}>
              <c-library-scanner></c-library-scanner>
            </template>

            <template if:true={isProfile}>
              <template if:true={profile}>
                <section class="profile-hero card">
                  <span class="avatar large">{initials}</span>
                  <div>
                    <h2>
                      {displayName}
                      <span class="badge badge-active">{membershipStatus}</span>
                    </h2>
                    <p>Member ID: {memberId}</p>
                    <p>{profile.Email__c} · {profile.Phone__c}</p>
                    <small>Joined: {joinedDate}</small>
                  </div>
                  <button class="button outline" onclick={beginProfileEdit}>
                    ✎ Edit Profile
                  </button>
                </section>
                <div class="tabs">
                  <template for:each={profileTabs} for:item="tab">
                    <button
                      key={tab.value}
                      class={tab.className}
                      data-value={tab.value}
                      onclick={selectProfileTab}
                    >
                      {tab.label}
                    </button>
                  </template>
                </div>
                <section class="profile-content card">
                  <template if:true={isPersonalProfile}
                    ><div class="detail-grid">
                      <div>
                        <small>Full Name</small><strong>{displayName}</strong>
                      </div>
                      <div>
                        <small>Email</small><strong>{profile.Email__c}</strong>
                      </div>
                      <div>
                        <small>Phone</small><strong>{profile.Phone__c}</strong>
                      </div>
                      <div>
                        <small>Account Status</small
                        ><strong>{membershipStatus}</strong>
                      </div>
                    </div></template
                  >
                  <template if:true={isAddressProfile}
                    ><div class="address-block">
                      <small>Address</small>
                      <p>{profile.Address__c}</p>
                    </div></template
                  >
                  <template if:true={isMembershipProfile}
                    ><div class="detail-grid">
                      <div><small>Plan</small><strong>{planName}</strong></div>
                      <div>
                        <small>Valid Until</small
                        ><strong>{membershipEndDate}</strong>
                      </div>
                      <div>
                        <small>Borrow Limit</small
                        ><strong>{planBorrowLimit}</strong>
                      </div>
                      <div>
                        <small>Loan Period</small
                        ><strong>{planLoanPeriod} days</strong>
                      </div>
                    </div></template
                  >
                  <template if:true={isActivityProfile}
                    ><div class="activity-filters">
                      <template for:each={activityFilters} for:item="filter"
                        ><button
                          key={filter.value}
                          class={filter.className}
                          data-value={filter.value}
                          onclick={selectActivityFilter}
                        >
                          {filter.label}
                        </button></template
                      >
                    </div>
                    <template if:true={hasActivities}
                      ><div class="activity-list">
                        <template for:each={activities} for:item="activity"
                          ><div class="activity-row" key={activity.id}>
                            <span class={activity.className}
                              ><lightning-icon
                                icon-name={activity.icon}
                                size="xx-small"
                              ></lightning-icon
                            ></span>
                            <div>
                              <strong>{activity.title}</strong
                              ><span>{activity.detail}</span
                              ><small>{activity.dateLabel}</small>
                            </div>
                          </div></template
                        >
                      </div></template
                    ><template if:false={hasActivities}
                      ><div class="empty-state">
                        No activity is available.
                      </div></template
                    ></template
                  >
                  <template if:true={isNotificationProfile}
                    ><div class="preference-header">
                      <div>
                        <h3>Notification preferences</h3>
                        <p>
                          Choose which channels can reach you for each library
                          update. In-app alerts remain available in your portal.
                        </p>
                      </div>
                      <button
                        class="button primary"
                        onclick={saveNotificationPreferences}
                        disabled={notificationPreferenceSaving}
                      >
                        {savePreferenceLabel}
                      </button>
                    </div>
                    <template if:true={preferenceRows.length}
                      ><div class="preference-table" role="table">
                        <div
                          class="preference-row preference-heading"
                          role="row"
                        >
                          <span>Notification</span><span>Channel</span
                          ><span>Delivery</span><span>Digest</span>
                        </div>
                        <template for:each={preferenceRows} for:item="row"
                          ><div class="preference-row" key={row.id} role="row">
                            <span>{row.notificationType}</span>
                            <span>{row.channel}</span>
                            <label class="preference-toggle">
                              <input
                                type="checkbox"
                                checked={row.enabled}
                                data-id={row.id}
                                onchange={changePreference}
                              />
                              <span class={row.statusClass}
                                >{row.enabledLabel}</span
                              >
                            </label>
                            <lightning-combobox
                              variant="label-hidden"
                              value={row.digestFrequency}
                              options={digestFrequencyOptions}
                              data-id={row.id}
                              onchange={changePreferenceFrequency}
                              label="Digest frequency"
                            ></lightning-combobox></div
                        ></template></div></template
                    ><template if:false={preferenceRows.length}
                      ><div class="empty-state">
                        Notification preferences are not available yet.
                      </div></template
                    ></template
                  >
                  <template if:true={isDigitalCardProfile}>
                    <c-library-digital-member-card></c-library-digital-member-card>
                  </template>
                  <template if:true={isAccessibilityProfile}>
                    <c-library-member-accessibility
                      onaccessibilitychange={handleAccessibilityChange}
                    ></c-library-member-accessibility>
                  </template>
                </section>
              </template>
              <template if:false={profile}>
                <div class="loading-state" role="status">Loading profile…</div>
              </template>
            </template>
          </template>
        </section>
      </div>
    </div>
  </template>

  <template if:true={bookDetail}>
    <div
      class="modal-backdrop"
      role="presentation"
      onclick={closeBookDetails}
    ></div>
    <section
      class="book-modal"
      role="dialog"
      aria-modal="true"
      aria-label="Book details"
    >
      <button class="modal-close" onclick={closeBookDetails}>×</button>
      <div class="detail-cover">
        <c-library-book-cover
          size="large"
          title={bookDetail.Name}
          author={bookDetailAuthors}
          cover-url={bookDetailCover}
        ></c-library-book-cover>
      </div>
      <div class="book-detail-main">
        <div class="detail-tags">
          <span class="category-pill">{bookDetailCategories}</span
          ><span class={bookDetailStatusClass}
            >{bookDetail.Available_Copies__c} of {bookDetail.Total_Copies__c}
            copies available</span
          >
        </div>
        <h2>{bookDetail.Name}</h2>
        <div class="author-row">
          <p class="book-author">{bookDetailAuthors}</p>
          <template if:true={bookDetailAuthorId}>
            <button class="author-follow-link" onclick={followBookAuthor}>
              + Follow author
            </button>
          </template>
        </div>
        <div class="detail-actions">
          <template if:true={bookDetailAvailable}
            ><button class="button primary" onclick={requestBorrow}>
              Borrow Book
            </button></template
          ><template if:false={bookDetailAvailable}
            ><button class="button primary" onclick={requestReserve}>
              Reserve Book
            </button></template
          ><button class="button outline" onclick={saveBookToReadingList}>
            Save to Reading List
          </button>
        </div>
        <p class="description">{bookDetail.Description__c}</p>
        <div class="metadata-grid">
          <div><small>ISBN</small><strong>{bookDetail.ISBN__c}</strong></div>
          <div>
            <small>Publisher</small><strong>{bookDetail.Publisher__c}</strong>
          </div>
          <div>
            <small>Publication Year</small
            ><strong>{bookDetail.Publication_Year__c}</strong>
          </div>
          <div>
            <small>Language</small><strong>{bookDetail.Language__c}</strong>
          </div>
          <div>
            <small>Edition</small><strong>{bookDetail.Edition__c}</strong>
          </div>
          <div>
            <small>Borrowed Copies</small><strong>{borrowedCopyCount}</strong>
          </div>
        </div>
        <section class="reviews" aria-label="Member reviews">
          <div class="reviews-head">
            <h3>Member reviews</h3>
            <template lwc:if={hasPublishedReviews}>
              <span class="rating-summary"
                ><strong>{averageRating}</strong
                ><span class="stars" aria-hidden="true">{averageStars}</span
                ><small>{reviewCountLabel}</small></span
              >
            </template>
          </div>
          <template lwc:if={hasMyReview}>
            <article class="review-card mine">
              <div class="review-top">
                <span class="stars">{myBookReview.stars}</span
                ><span class={myBookReview.statusClass}
                  >{myBookReview.status}</span
                >
              </div>
              <p>{myBookReview.reviewText}</p>
              <small>Your review · {myReviewNote}</small>
            </article>
          </template>
          <template for:each={otherReviews} for:item="review">
            <article class="review-card" key={review.id}>
              <div class="review-top">
                <span class="stars">{review.stars}</span>
              </div>
              <p>{review.reviewText}</p>
              <small>Library member · {review.dateLabel}</small>
            </article>
          </template>
          <template lwc:if={showNoReviews}>
            <p class="reviews-empty">
              No reviews yet. Be the first to share your experience.
            </p>
          </template>
        </section>
        <section class="review-box" aria-label="Write a book review">
          <h3>Share your experience</h3>
          <p>Reviews are checked by a librarian before they appear publicly.</p>
          <lightning-input
            type="number"
            min="1"
            max="5"
            label="Rating (1-5)"
            value={reviewRating}
            onchange={handleReviewRating}
          ></lightning-input>
          <textarea
            class="review-text"
            maxlength="150"
            placeholder="Write at least 10 characters"
            value={reviewText}
            oninput={handleReviewText}
          ></textarea>
          <button class="button primary" onclick={submitReview}>
            Submit for moderation
          </button>
          <template if:true={reviewStatus}
            ><span class="review-status">Status: {reviewStatus}</span></template
          >
        </section>
      </div>
    </section>
  </template>

  <template if:true={showConfirmation}>
    <div class="modal-backdrop"></div>
    <section class="confirm-modal" role="dialog" aria-modal="true">
      <div class="confirm-icon">?</div>
      <h2>{confirmationTitle}</h2>
      <p>{confirmationMessage}</p>
      <template if:true={isDefectConfirmation}>
        <textarea
          class="defect-notes"
          placeholder="Describe the missing or unreadable pages (optional)"
          oninput={updateDefectNotes}
        ></textarea>
      </template>
      <template if:true={error}
        ><div class="modal-error" role="alert">{error}</div></template
      >
      <div>
        <button class="button outline" onclick={closeConfirmation}>
          Go Back</button
        ><button
          class={confirmationButtonClass}
          onclick={confirmSelectedAction}
        >
          {confirmationButtonLabel}
        </button>
      </div>
    </section>
  </template>

  <template if:true={editProfile}>
    <div class="modal-backdrop"></div>
    <section class="edit-modal" role="dialog" aria-modal="true">
      <h2>Edit Profile</h2>
      <div class="form-grid">
        <lightning-input
          class="profile-field"
          label="First Name"
          name="firstName"
          value={firstName}
          onchange={handleInput}
          required
        ></lightning-input
        ><lightning-input
          class="profile-field"
          label="Last Name"
          name="lastName"
          value={lastName}
          onchange={handleInput}
          required
        ></lightning-input
        ><lightning-input
          class="profile-field"
          label="Phone"
          name="phone"
          value={phone}
          onchange={handleInput}
        ></lightning-input
        ><lightning-textarea
          class="profile-field full"
          label="Address"
          name="address"
          value={address}
          onchange={handleInput}
        ></lightning-textarea>
      </div>
      <div class="modal-actions">
        <button class="button outline" onclick={closeProfileEdit}>Cancel</button
        ><button class="button primary" onclick={saveProfile}>
          Update Profile
        </button>
      </div>
    </section>
  </template>
</template>
