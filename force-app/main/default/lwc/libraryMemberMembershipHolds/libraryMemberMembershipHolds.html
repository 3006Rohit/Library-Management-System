<template>
  <section class="hold-page" aria-label="Membership holds">
    <div class="hold-header">
      <div>
        <p class="eyebrow">Flexible membership</p>
        <h2>Membership holds</h2>
        <p>
          Pause your membership for travel, health, or other eligible reasons.
        </p>
      </div>
      <button type="button" class="refresh" onclick={refresh}>Refresh</button>
    </div>
    <template if:true={loading}
      ><div class="loading">Loading membership policy…</div></template
    >
    <template if:true={error}
      ><div class="error" role="alert">{error}</div></template
    >
    <template if:true={graceMessage}
      ><div class="notice" role="status">{graceMessage}</div></template
    >
    <div class="hold-grid">
      <article class="request-card">
        <h3>Request a hold</h3>
        <p>Requests can last 1–90 days and are active only after approval.</p>
        <label
          >Start date
          <input
            type="date"
            data-field="startDate"
            value={startDate}
            onchange={capture}
        /></label>
        <label
          >End date
          <input
            type="date"
            data-field="endDate"
            value={endDate}
            onchange={capture}
        /></label>
        <label
          >Reason
          <textarea
            data-field="reason"
            onchange={capture}
            placeholder="Tell us why you need a hold"
          >
{reason}</textarea>
        </label>
        <button type="button" class="primary" onclick={submit}>
          Request hold
        </button>
      </article>
      <article class="history-card">
        <h3>Request history</h3>
        <template if:true={hasHolds}>
          <div class="hold-list">
            <template for:each={holds} for:item="hold">
              <div class="hold-row" key={hold.id}>
                <div>
                  <strong>{hold.startDate} → {hold.endDate}</strong>
                  <p>{hold.reason}</p>
                </div>
                <span class="status">{hold.status}</span>
                <template if:true={hold.adjustedEndDate}
                  ><small
                    >Membership now ends {hold.adjustedEndDate}</small
                  ></template
                >
                <template if:true={hold.decisionReason}
                  ><small>{hold.decisionReason}</small></template
                >
                <template if:true={hold.canCancel}
                  ><button
                    type="button"
                    class="link-button"
                    data-id={hold.id}
                    onclick={cancel}
                  >
                    Cancel
                  </button></template
                >
              </div>
            </template>
          </div>
        </template>
        <template if:false={hasHolds}
          ><div class="empty">No membership hold requests yet.</div></template
        >
      </article>
    </div>
  </section>
</template>
