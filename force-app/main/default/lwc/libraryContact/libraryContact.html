<template>
  <div class="page">
    <div class="frame">
      <c-library-auth-nav></c-library-auth-nav>

      <div class="split">
        <section class="intro">
          <span class="badge">▥ Contact Us</span>
          <h1>Get In Touch With Our Team</h1>
          <p class="sub">
            Fill out the form and our librarians will get back to you within 1-2
            business days.
          </p>

          <div class="info">
            <div class="info-card">
              <span class="icon">⌂</span>
              <strong>Our branch</strong>
              <small>{addressText}</small>
            </div>
            <div class="info-card">
              <span class="icon">◷</span>
              <strong>Working hours</strong>
              <small>{hoursText}</small>
            </div>
            <a class="info-card link" href="/library/#ask">
              <span class="icon">✦</span>
              <strong>Ask the Library Assistant</strong>
              <small>Quick answers from our chat assistant</small>
            </a>
            <a class="info-card link" href="/library/register">
              <span class="icon">♡</span>
              <strong>Become a member</strong>
              <small>Join free and start borrowing</small>
            </a>
          </div>
        </section>

        <div class="card">
          <template lwc:if={sent}>
            <div class="done" role="status">
              <span class="icon big">✓</span>
              <h2>Message sent</h2>
              <p>
                Thanks for reaching out. A librarian will reply by email within
                1-2 business days.
              </p>
              <button type="button" class="primary" onclick={sendAnother}>
                Send another message
              </button>
            </div>
          </template>
          <template lwc:else>
            <form onsubmit={handleSubmit} novalidate>
              <div class="two">
                <div>
                  <label for="firstName">First Name</label>
                  <input
                    id="firstName"
                    class="field"
                    name="firstName"
                    autocomplete="given-name"
                    placeholder="Jane"
                    value={form.firstName}
                    oninput={handleInput}
                  />
                </div>
                <div>
                  <label for="lastName">Last Name</label>
                  <input
                    id="lastName"
                    class="field"
                    name="lastName"
                    autocomplete="family-name"
                    placeholder="Doe"
                    value={form.lastName}
                    oninput={handleInput}
                  />
                </div>
              </div>

              <label for="email">Email</label>
              <input
                id="email"
                class="field"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="jane@example.com"
                value={form.email}
                oninput={handleInput}
              />

              <label for="phone">Phone Number</label>
              <input
                id="phone"
                class="field"
                name="phone"
                type="tel"
                autocomplete="tel"
                placeholder="000-000-0000"
                value={form.phone}
                oninput={handleInput}
              />

              <label for="subject">Subject</label>
              <input
                id="subject"
                class="field"
                name="subject"
                placeholder="How can we help?"
                value={form.subject}
                oninput={handleInput}
              />

              <label for="message">Message</label>
              <textarea
                id="message"
                class="field area"
                name="message"
                maxlength="4000"
                placeholder="Tell us more..."
                value={form.message}
                oninput={handleInput}
              ></textarea>

              <template lwc:if={error}>
                <div class="error" role="alert">{error}</div>
              </template>

              <button type="submit" class="primary" disabled={busy}>
                {submitLabel}
              </button>
            </form>
          </template>
        </div>
      </div>
    </div>
  </div>
</template>
