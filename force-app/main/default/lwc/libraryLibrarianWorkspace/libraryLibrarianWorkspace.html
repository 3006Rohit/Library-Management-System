<template>
    <lightning-card title="Library Librarian Workspace" icon-name="standard:education">
        <div class="workspace-shell">
        <header class="workspace-header">
            <div>
                <p class="workspace-eyebrow">INTERNAL OPERATIONS</p>
                <h1>Librarian workspace</h1>
                <p class="workspace-subtitle">Keep the collection moving, members supported, and every loan accounted for.</p>
            </div>
            <div class="workspace-status"><span class="status-dot"></span>Live library operations</div>
        </header>
        <nav class="workspace-nav" aria-label="Librarian sections"><template for:each={navItems} for:item="item"><button key={item.value} class={item.className} data-section={item.value} aria-pressed={item.active} onclick={selectSection}>{item.label}</button></template></nav>
        <template if:true={loading}><lightning-spinner alternative-text="Working"></lightning-spinner></template><template if:true={error}><div class="slds-notify slds-notify_alert slds-theme_error slds-m-around_medium">{error}</div></template>
        <div class="section-heading"><div><p class="section-kicker">{section}</p><h2>{sectionHeading}</h2><p>{sectionDescription}</p></div><template if:true={isDashboard}><div class="quick-actions"><button class="quick-action" data-section="Books" onclick={openDashboardSection}>Add or manage books</button><button class="quick-action quick-action_primary" data-section="Borrowing" onclick={openDashboardSection}>Open borrowing desk</button></div></template></div>
        <template if:true={isDashboard}><div class="slds-grid slds-wrap slds-gutters slds-p-around_medium"><template for:each={dashboardCards} for:item="card"><div key={card.label} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4"><button class="metric metric-button" data-section={card.section} onclick={openDashboardSection}><span>{card.label}</span><strong>{card.value}</strong></button></div></template></div><div class="recent-loans-panel"><div class="recent-loans-heading"><div><p class="section-kicker">ACTIVITY</p><h2>Recent loans</h2><p>Keep track of the latest circulation activity.</p></div><button class="quick-action" data-section="Borrowing" onclick={openDashboardSection}>Open borrowing desk</button></div><template if:true={hasRecentLoans}><div class="loan-list"><template for:each={decoratedRecentLoans} for:item="loan"><article key={loan.Id} class="loan-card"><div class="loan-icon">▣</div><div class="loan-main"><div class="loan-title-row"><strong>{loan.bookTitle}</strong><span class={loan.statusClass}>{loan.Status__c}</span></div><p>{loan.memberName}</p><small>{loan.Name} · {loan.Book_Copy__r.Name} · {loan.dueLabel}</small></div><div class="loan-actions"><button class="loan-action return-action" data-id={loan.Id} onclick={doReturn}>Return</button><button class="loan-action" data-id={loan.Id} onclick={doRenew}>Renew</button></div></article></template></div></template><template if:false={hasRecentLoans}><div class="empty-state"><span class="empty-icon">✓</span><div><strong>No recent loans</strong><p>New circulation activity will appear here.</p></div></div></template></div></template>
        <template if:true={isBooks}><div class="books-section"><div class="books-toolbar"><div class="books-filter-grid"><lightning-input name="bookSearch" label="Search books" placeholder="Title, ISBN, author, or publisher" value={bookSearch} onchange={handleInput}></lightning-input><lightning-combobox name="bookStatus" label="Status" value={bookStatus} options={bookStatusOptions} onchange={handleInput}></lightning-combobox><lightning-combobox name="bookCategory" label="Category" value={bookCategory} options={categoryOptions} onchange={handleInput}></lightning-combobox></div><div class="books-actions"><lightning-button label="Search" variant="neutral" onclick={searchBooksNow}></lightning-button><lightning-button label="Add Book" variant="brand" onclick={openAddBook}></lightning-button></div></div><div class="books-table-card"><lightning-datatable key-field="Id" data={books} columns={bookColumns} hide-checkbox-column onrowaction={bookAction}></lightning-datatable></div><div class="books-pagination"><lightning-button label="Previous" onclick={previousBooks} disabled={isFirstBookPage}></lightning-button><span>Page <strong>{bookPage}</strong></span><lightning-button label="Next" onclick={nextBooks}></lightning-button></div></div></template>
        <template if:true={isMembers}><div class="slds-p-around_medium"><div class="slds-grid slds-wrap slds-gutters"><div class="slds-col slds-size_1-of-1 slds-large-size_2-of-3"><lightning-input name="memberSearch" label="Member ID, name, email, or phone" value={memberSearch} onchange={handleInput}></lightning-input></div><div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3"><lightning-combobox name="memberStatus" label="Status" value={memberStatus} options={memberStatusOptions} onchange={handleInput}></lightning-combobox></div></div><lightning-button class="slds-m-top_small" label="Search" onclick={loadMembers}></lightning-button><lightning-datatable class="slds-m-top_medium" key-field="Id" data={members} columns={memberColumns} hide-checkbox-column onrowaction={viewMember}></lightning-datatable><template if:true={memberDetail}><article class="slds-box slds-m-top_medium"><h2 class="slds-text-heading_medium">{memberDetail.member.Name} — {memberDetail.member.First_Name__c} {memberDetail.member.Last_Name__c}</h2><p>{memberDetail.member.Email__c} | {memberDetail.member.Phone__c} | {memberDetail.member.Status__c} | {memberDetail.member.Membership_Plan__r.Name}</p><p>{memberDetail.member.Membership_Start_Date__c} to {memberDetail.member.Membership_End_Date__c} | Outstanding balance: {memberDetail.outstandingBalance}</p><h3 class="slds-text-heading_small slds-m-top_medium">Loans</h3><template for:each={memberDetail.loans} for:item="loan"><div key={loan.Id} class="row">{loan.Name} — {loan.Book_Copy__r.Book__r.Name} — {loan.Book_Copy__r.Name} — Due {loan.Due_Date__c} — {loan.Status__c}<lightning-button-group class="slds-float_right"><lightning-button label="Return" data-id={loan.Id} onclick={doReturn}></lightning-button><lightning-button label="Renew" data-id={loan.Id} onclick={doRenew}></lightning-button></lightning-button-group></div></template><h3 class="slds-text-heading_small slds-m-top_medium">Borrowing history</h3><template for:each={memberDetail.loans} for:item="loan"><div key={loan.Id} class="row">{loan.Book_Copy__r.Book__r.Name} — Borrowed {loan.Borrow_Date__c} — Returned {loan.Return_Date__c} — {loan.Status__c}</div></template><h3 class="slds-text-heading_small slds-m-top_medium">Reservations</h3><template for:each={memberDetail.reservations} for:item="reservation"><div key={reservation.Id} class="row">{reservation.Book__r.Name} — Queue {reservation.Queue_Position__c} — {reservation.Status__c} — {reservation.Ready_Date__c}</div></template><h3 class="slds-text-heading_small slds-m-top_medium">Fines</h3><template for:each={memberDetail.fines} for:item="fine"><div key={fine.Id} class="row">{fine.Name} — {fine.Fine_Type__c} — Amount {fine.Amount__c} — Balance {fine.Balance__c} — {fine.Status__c}</div></template></article></template></div></template>
        <template if:true={isBorrowing}><div class="borrowing-section"><div class="borrowing-intro"><div><p class="section-kicker">CIRCULATION DESK</p><h2>Borrowing & checkout</h2><p>Choose a member, find an available copy, and complete a controlled checkout.</p></div><span class="desk-status"><i></i>Ready for checkout</span></div><div class="checkout-card"><div class="checkout-card-heading"><div class="step-number">1</div><div><h3>Select member and book</h3><p>Choose who is borrowing and which title they are receiving.</p></div></div><div class="borrowing-select-grid"><lightning-combobox name="selectedMemberId" label="Member" placeholder="Select a member" value={selectedMemberId} options={memberOptions} onchange={handleBorrowingInput}></lightning-combobox><lightning-combobox name="selectedBookId" label="Book" placeholder="Select a book" value={selectedBookId} options={bookOptions} onchange={handleBorrowingInput}></lightning-combobox></div><div class="copy-search-row"><lightning-input name="copySearch" label="Search library copies" placeholder="Search title, barcode, or copy name" value={copySearch} onchange={handleInput}></lightning-input><lightning-button class="copy-search-button" label="Search copies" variant="neutral" onclick={searchCopiesNow}></lightning-button></div><div class="copy-table"><lightning-datatable key-field="Id" data={copies} columns={borrowingCopyColumns} hide-checkbox-column onrowaction={chooseCopy}></lightning-datatable></div><div class="copy-pagination"><lightning-button label="Previous" onclick={previousCopies} disabled={isFirstCopyPage}></lightning-button><span>Page <strong>{copyPage}</strong></span><lightning-button label="Next" onclick={nextCopies} disabled={copyHasNext}></lightning-button></div></div><div class="checkout-action-card"><div class="checkout-card-heading"><div class="step-number">2</div><div><h3>Complete checkout</h3><p>Select a member and an available copy before checking out.</p></div></div><div class="selection-summary"><span>Selected member <strong>{selectedMemberId}</strong></span><span>Selected copy <strong>{selectedCopyId}</strong></span></div><lightning-button label="Checkout selected copy" variant="brand" onclick={doCheckout}></lightning-button></div><div class="borrowing-history-card"><div class="borrowing-card-heading"><div><p class="section-kicker">RECENT ACTIVITY</p><h3>Recent loans</h3><p>Return or renew the latest circulation records.</p></div><button class="quick-action" data-section="Dashboard" onclick={openDashboardSection}>View dashboard</button></div><template if:true={hasRecentLoans}><div class="loan-list"><template for:each={decoratedRecentLoans} for:item="loan"><article key={loan.Id} class="loan-card"><div class="loan-icon">▣</div><div class="loan-main"><div class="loan-title-row"><strong>{loan.bookTitle}</strong><span class={loan.statusClass}>{loan.Status__c}</span></div><p>{loan.memberName}</p><small>{loan.Name} · {loan.Book_Copy__r.Name} · {loan.dueLabel}</small></div><div class="loan-actions"><button class="loan-action return-action" data-id={loan.Id} onclick={doReturn}>Return</button><button class="loan-action" data-id={loan.Id} onclick={doRenew}>Renew</button></div></article></template></div></template><template if:false={hasRecentLoans}><div class="empty-state"><span class="empty-icon">✓</span><div><strong>No recent loans</strong><p>New circulation activity will appear here.</p></div></div></template></div></div></template>
        <template if:true={isRegistrations}><div class="slds-p-around_medium"><lightning-combobox name="registrationStatus" label="Status" value={registrationStatus} options={registrationStatusOptions} onchange={handleInput}></lightning-combobox><lightning-input name="rejectReason" label="Reject reason" value={rejectReason} onchange={handleInput}></lightning-input><lightning-button class="slds-m-top_small" label="Refresh" onclick={loadRegistrations}></lightning-button><lightning-datatable class="slds-m-top_medium" key-field="Id" data={registrations} columns={registrationColumns} hide-checkbox-column onrowaction={registrationAction}></lightning-datatable></div></template>
        <template if:true={isReservations}><div class="slds-p-around_medium"><div class="slds-grid slds-wrap slds-gutters"><div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3"><lightning-combobox name="reservationMemberId" label="Member" value={reservationMemberId} options={memberOptions} onchange={handleInput}></lightning-combobox></div><div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3"><lightning-combobox name="reservationBookId" label="Book" value={reservationBookId} options={bookOptions} onchange={handleInput}></lightning-combobox></div></div><lightning-button class="slds-m-top_small" label="Create Reservation" variant="brand" onclick={createReservationNow}></lightning-button><lightning-combobox class="slds-m-top_small" name="reservationStatus" label="Status filter" value={reservationStatus} options={reservationStatusOptions} onchange={handleInput}></lightning-combobox><lightning-button class="slds-m-top_small" label="Refresh" onclick={loadReservations}></lightning-button><lightning-button class="slds-m-top_small slds-m-left_small" label="Process expired holds" onclick={processExpired}></lightning-button><lightning-datatable class="slds-m-top_medium" key-field="Id" data={reservations} columns={reservationColumns} hide-checkbox-column onrowaction={reservationAction}></lightning-datatable></div></template>
        <template if:true={isFines}><div class="slds-p-around_medium"><lightning-combobox name="fineStatus" label="Status" value={fineStatus} options={fineStatusOptions} onchange={handleInput}></lightning-combobox><lightning-button class="slds-m-top_small" label="Refresh" onclick={loadFines}></lightning-button><lightning-datatable class="slds-m-top_medium" key-field="Id" data={fines} columns={fineColumns} hide-checkbox-column onrowaction={fineAction}></lightning-datatable><div class="slds-box slds-m-top_medium"><lightning-input name="paymentAmount" type="number" label="Payment amount" value={paymentAmount} onchange={handleInput}></lightning-input><lightning-button class="slds-m-top_small" label="Record Payment" onclick={payFine}></lightning-button><lightning-input name="waiverReason" label="Waiver reason" value={waiverReason} onchange={handleInput}></lightning-input><lightning-button class="slds-m-top_small" label="Waive Selected Fine" variant="destructive" onclick={waiveSelectedFine}></lightning-button></div></div></template>
        <template if:true={showBookModal}><section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open"><div class="slds-modal__container"><header class="slds-modal__header"><h2 class="slds-text-heading_medium">{editingBook ? 'Edit Book' : 'Add Book'}</h2></header><div class="slds-modal__content slds-p-around_medium"><lightning-input name="book.title" label="Title" value={bookForm.title} onchange={handleInput} required></lightning-input><lightning-input name="book.isbn" label="ISBN" value={bookForm.isbn} onchange={handleInput} required></lightning-input><lightning-input name="book.publisher" label="Publisher" value={bookForm.publisher} onchange={handleInput}></lightning-input><lightning-input name="book.publicationYear" type="number" label="Publication Year" value={bookForm.publicationYear} onchange={handleInput}></lightning-input><lightning-input name="book.edition" label="Edition" value={bookForm.edition} onchange={handleInput}></lightning-input><lightning-input name="book.language" label="Language" value={bookForm.language} onchange={handleInput}></lightning-input><lightning-textarea name="book.description" label="Description" value={bookForm.description} onchange={handleInput}></lightning-textarea><lightning-input name="book.coverUrl" label="Cover Image URL" value={bookForm.coverUrl} onchange={handleInput}></lightning-input><lightning-dual-listbox name="authors" label="Authors" source-label="Available" selected-label="Selected" options={authorOptions} value={selectedAuthorIds} onchange={handleBookSelect}></lightning-dual-listbox><lightning-dual-listbox name="categories" label="Categories" source-label="Available" selected-label="Selected" options={categoryOptions} value={selectedCategoryIds} onchange={handleCategorySelect}></lightning-dual-listbox></div><footer class="slds-modal__footer"><lightning-button label="Cancel" onclick={closeModals}></lightning-button><lightning-button class="slds-m-left_small" variant="brand" label="Save" onclick={saveBook}></lightning-button></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template>
        <template if:true={showBookDetail}><section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open book-detail-modal"><div class="slds-modal__container"><header class="slds-modal__header book-detail-header"><p class="section-kicker">BOOK DETAILS</p><h2>{bookDetail.Name}</h2><p class="book-detail-subtitle">Library title and physical copy management</p></header><div class="slds-modal__content book-detail-content"><div class="book-meta-grid"><div><span>ISBN</span><strong>{bookDetail.ISBN__c}</strong></div><div><span>Publisher</span><strong>{bookDetail.Publisher__c}</strong></div><div><span>Language</span><strong>{bookDetail.Language__c}</strong></div></div><div class="book-info-block"><p><b>Authors</b><span><template for:each={bookDetail.Book_Authors__r} for:item="a">{a.Author__r.Name} </template></span></p><p><b>Categories</b><span><template for:each={bookDetail.Book_Category_Links__r} for:item="c">{c.Book_Category__r.Name} </template></span></p><p class="book-description">{bookDetail.Description__c}</p></div><div class="copies-heading"><div><p class="section-kicker">INVENTORY</p><h3>Physical copies</h3><p>Manage availability, shelf location, and copy condition.</p></div><lightning-button label="Add Copy" variant="brand" onclick={openAddCopy}></lightning-button></div><div class="copies-table"><lightning-datatable key-field="Id" data={bookDetail.Book_Copies__r} columns={copyColumns} hide-checkbox-column onrowaction={copyAction}></lightning-datatable></div></div><footer class="slds-modal__footer book-detail-footer"><lightning-button label="Edit Book" onclick={openEditBook}></lightning-button><lightning-button class="slds-m-left_small" label="Close" onclick={closeModals}></lightning-button></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template>
        <template if:true={showCopyModal}><section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open"><div class="slds-modal__container"><header class="slds-modal__header"><h2 class="slds-text-heading_medium">Manage Copy</h2></header><div class="slds-modal__content slds-p-around_medium"><template if:false={selectedCopyId}><lightning-input name="copy.barcode" label="Barcode" value={copyForm.barcode} onchange={handleInput} required></lightning-input></template><lightning-input name="copy.shelf" label="Shelf Location" value={copyForm.shelf} onchange={handleInput}></lightning-input><lightning-input name="copy.acquisitionDate" type="date" label="Acquisition Date" value={copyForm.acquisitionDate} onchange={handleInput}></lightning-input><lightning-input name="copy.condition" label="Condition" value={copyForm.condition} onchange={handleInput}></lightning-input><lightning-input name="copy.price" type="number" label="Price" value={copyForm.price} onchange={handleInput}></lightning-input><lightning-combobox name="copy.status" label="Status" value={copyForm.status} options={copyStatusOptions} onchange={handleInput}></lightning-combobox></div><footer class="slds-modal__footer"><lightning-button label="Cancel" onclick={closeModals}></lightning-button><template if:true={selectedCopyId}><lightning-button class="slds-m-left_small" variant="brand" label="Save" onclick={saveExistingCopy}></lightning-button></template><template if:false={selectedCopyId}><lightning-button class="slds-m-left_small" variant="brand" label="Save" onclick={saveCopy}></lightning-button></template></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template>
        </div>
    </lightning-card>
</template>
