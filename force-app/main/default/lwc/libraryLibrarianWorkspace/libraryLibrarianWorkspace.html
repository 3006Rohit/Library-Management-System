<template>
  <div class={shellClass}>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"
          ><lightning-icon
            icon-name="utility:knowledge_base"
            size="x-small"
          ></lightning-icon></span
        ><span>Library Management</span>
      </div>
      <nav aria-label="Librarian navigation">
        <template for:each={navItems} for:item="item">
          <button
            key={item.value}
            class={item.className}
            data-section={item.value}
            onclick={selectSection}
            aria-current={item.active}
          >
            <lightning-icon
              icon-name={item.icon}
              size="xx-small"
            ></lightning-icon
            ><span>{item.label}</span>
          </button>
        </template>
      </nav>
    </aside>

    <div class="main-frame">
      <header class="topbar">
        <button
          class="menu-button"
          onclick={toggleSidebar}
          aria-label="Toggle navigation"
        >
          <lightning-icon
            icon-name="utility:rows"
            size="small"
          ></lightning-icon>
        </button>
        <label class="global-search"
          ><lightning-icon
            icon-name="utility:search"
            size="xx-small"
          ></lightning-icon
          ><input
            type="search"
            placeholder="Search..."
            value={globalSearch}
            oninput={handleGlobalSearch}
        /></label>
        <div class="top-actions">
          <button
            class="icon-button"
            title="Notifications"
            aria-label="Notifications"
            aria-expanded={notificationsOpen}
            onclick={toggleNotifications}
          >
            <lightning-icon
              icon-name="utility:notification"
              size="x-small"
            ></lightning-icon
            ><template if:true={hasNotifications}
              ><span class="notification-dot"></span
            ></template>
          </button>
          <template if:true={notificationsOpen}>
            <section
              class="librarian-notification-panel"
              role="dialog"
              aria-label="Library notifications"
            >
              <div class="notification-panel-header">
                <strong>Notifications</strong>
                <span>{librarianNotifications.length} alerts</span>
              </div>
              <div class="notification-list">
                <template for:each={librarianNotifications} for:item="notice">
                  <button
                    key={notice.key}
                    class="librarian-notification"
                    data-section={notice.section}
                    onclick={openNotification}
                  >
                    <span class={notice.iconClass}>
                      <lightning-icon
                        icon-name={notice.icon}
                        size="xx-small"
                      ></lightning-icon>
                    </span>
                    <span class="notification-copy">
                      <strong>{notice.title}</strong>
                      <span>{notice.message}</span>
                    </span>
                    <lightning-icon
                      icon-name="utility:chevronright"
                      size="xx-small"
                    ></lightning-icon>
                  </button>
                </template>
                <template if:false={hasNotifications}>
                  <p class="notification-empty">You’re all caught up.</p>
                </template>
              </div>
            </section>
          </template>
          <div class="avatar">{userInitials}</div>
          <div class="profile">
            <strong>{userName}</strong><span>Librarian</span>
          </div>
          <lightning-icon
            icon-name="utility:down"
            size="xx-small"
          ></lightning-icon>
        </div>
      </header>
      <main class="content">
        <template if:true={loading}
          ><div class="loading">
            <lightning-spinner
              alternative-text="Loading library data"
              size="small"
            ></lightning-spinner></div
        ></template>
        <template if:true={error}
          ><div class="error-banner" role="alert">
            <lightning-icon
              icon-name="utility:error"
              size="x-small"
            ></lightning-icon
            >{error}
          </div></template
        >
        <template if:false={isLibrarianAssistant}>
          <div class="page-heading">
            <div>
              <h1>{pageTitle}</h1>
              <p>{pageSubtitle}</p>
            </div>
          </div>
        </template>

        <template if:true={isLibrarianAssistant}>
          <section class="lib-assistant-page" aria-label="Librarian Assistant">
            <section class="lib-assistant-hero">
              <div class="lib-assistant-hero-art" aria-hidden="true">🤖</div>
              <div>
                <h1>Librarian Assistant</h1>
                <p>Your AI assistant for library management</p>
                <span
                  >Contextual AI over governed Salesforce operational data and
                  Data Cloud insights for safe, read-only decisions.</span
                >
              </div>
              <div class="lib-assistant-hero-books" aria-hidden="true">
                ▥ ✦ ▥
              </div>
            </section>
            <div class="lib-assistant-workspace">
              <section class="lib-assistant-help-card">
                <h2>What can I help you with?</h2>
                <p>Ask questions or try one of the examples below.</p>
                <div class="lib-assistant-topic-grid">
                  <button
                    class="lib-assistant-topic blue-topic"
                    data-question="Find available copies of this book"
                    onclick={useAssistantPrompt}
                  >
                    <span>▣</span><strong>Manage Books</strong
                    ><small
                      >Find books, copies, availability, and demand.</small
                    >
                  </button>
                  <button
                    class="lib-assistant-topic green-topic"
                    data-question="Give me this member's borrowing history"
                    onclick={useAssistantPrompt}
                  >
                    <span>♟</span><strong>Member Management</strong
                    ><small
                      >Review authorized member summaries and history.</small
                    >
                  </button>
                  <button
                    class="lib-assistant-topic purple-topic"
                    data-question="Show overdue loans"
                    onclick={useAssistantPrompt}
                  >
                    <span>↔</span><strong>Circulation</strong
                    ><small
                      >Review overdue loans and today's circulation
                      activity.</small
                    >
                  </button>
                  <button
                    class="lib-assistant-topic red-topic"
                    data-question="Show pending reservations"
                    onclick={useAssistantPrompt}
                  >
                    <span>▦</span><strong>Reservations</strong
                    ><small
                      >View pending reservation requests and queues.</small
                    >
                  </button>
                  <button
                    class="lib-assistant-topic gold-topic"
                    data-question="Show unpaid fines"
                    onclick={useAssistantPrompt}
                  >
                    <span>₹</span><strong>Fines &amp; Payments</strong
                    ><small
                      >Check fines, receive payments, and generate
                      reports.</small
                    >
                  </button>
                  <button
                    class="lib-assistant-topic cyan-topic"
                    data-question="Which books have high demand?"
                    onclick={useAssistantPrompt}
                  >
                    <span>▥</span><strong>Reports &amp; Insights</strong
                    ><small
                      >Use Data Cloud metrics for demand and activity
                      insights.</small
                    >
                  </button>
                </div>
                <div class="lib-assistant-examples">
                  <strong>💡 Example Questions</strong>
                  <div>
                    <template for:each={assistantQuestions} for:item="question"
                      ><button
                        key={question}
                        data-question={question}
                        onclick={useAssistantPrompt}
                      >
                        {question}
                      </button></template
                    >
                  </div>
                </div>
              </section>
              <section class="lib-assistant-chat-card">
                <header class="lib-assistant-chat-header">
                  <span class="lib-assistant-bot-avatar">✦</span>
                  <div>
                    <strong>Librarian Assistant</strong
                    ><small>● Inline Agentforce</small>
                  </div>
                  <button
                    type="button"
                    onclick={clearAssistantChat}
                    disabled={assistantBusy}
                  >
                    ▱ &nbsp; Clear Chat
                  </button>
                </header>
                <div class="lib-assistant-messages">
                  <template for:each={assistantMessages} for:item="message"
                    ><div key={message.id} class={message.className}>
                      {message.text}
                    </div></template
                  >
                </div>
                <form
                  class="lib-assistant-composer"
                  onsubmit={sendAssistantMessage}
                >
                  <span aria-hidden="true">⌕</span
                  ><input
                    value={assistantInput}
                    oninput={handleAssistantInput}
                    placeholder="Type your question here..."
                    aria-label="Ask the librarian assistant"
                    disabled={assistantBusy}
                  /><button
                    type="submit"
                    aria-label="Send question"
                    disabled={assistantBusy}
                  >
                    {assistantSendLabel}
                  </button>
                </form>
              </section>
            </div>
          </section>
        </template>

        <template if:true={isAcquisitions}>
          <c-library-acquisition-dashboard></c-library-acquisition-dashboard>
        </template>

        <template if:true={isDashboard}>
          <section
            class="panel data-cloud-panel"
            aria-label="Data Cloud analytics"
          >
            <div class="analytics-panel-header">
              <div class="analytics-title-lockup">
                <span class="analytics-panel-icon" aria-hidden="true">✦</span>
                <div>
                  <h2>Data Cloud Analytics</h2>
                </div>
              </div>
              <template if:true={analyticsAvailable}>
                <span class="analytics-status connected"
                  ><span aria-hidden="true"></span>Connected</span
                >
              </template>
              <template if:false={analyticsAvailable}>
                <span class="analytics-status unavailable"
                  ><span aria-hidden="true"></span>Unavailable</span
                >
              </template>
            </div>
            <template if:true={analyticsAvailable}>
              <div class="analytics-summary-grid">
                <template for:each={copyAnalytics} for:item="metric">
                  <article class="analytics-card" key={metric.label}>
                    <span class="analytics-stat-icon" aria-hidden="true"
                      >{metric.icon}</span
                    >
                    <span class="analytics-stat-copy"
                      ><small>{metric.label}</small
                      ><strong>{metric.value}</strong></span
                    >
                  </article>
                </template>
                <template for:each={loanAnalytics} for:item="metric">
                  <article class="analytics-card" key={metric.label}>
                    <span class="analytics-stat-icon" aria-hidden="true"
                      >{metric.icon}</span
                    >
                    <span class="analytics-stat-copy"
                      ><small>{metric.label}</small
                      ><strong>{metric.value}</strong></span
                    >
                  </article>
                </template>
                <template for:each={reservationAnalytics} for:item="metric">
                  <article class="analytics-card" key={metric.label}>
                    <span class="analytics-stat-icon" aria-hidden="true"
                      >{metric.icon}</span
                    >
                    <span class="analytics-stat-copy"
                      ><small>{metric.label}</small
                      ><strong>{metric.value}</strong></span
                    >
                  </article>
                </template>
                <template for:each={fineAnalytics} for:item="metric">
                  <article class="analytics-card" key={metric.label}>
                    <span class="analytics-stat-icon" aria-hidden="true"
                      >{metric.icon}</span
                    >
                    <span class="analytics-stat-copy"
                      ><small>{metric.label}</small
                      ><strong>{metric.value}</strong></span
                    >
                  </article>
                </template>
              </div>
              <div class="analytics-lists">
                <div>
                  <h3>Top Borrowed Books</h3>
                  <template
                    for:each={analytics.topBorrowedBooks}
                    for:item="book"
                  >
                    <div class="analytics-row" key={book.bookId}>
                      <span>{book.bookName}</span
                      ><strong>{book.borrowCount}</strong>
                    </div>
                  </template>
                </div>
                <div>
                  <h3>Reservation Demand</h3>
                  <template
                    for:each={analytics.reservationDemand}
                    for:item="book"
                  >
                    <div class="analytics-row" key={book.bookId}>
                      <span>{book.bookName || 'Book'}</span
                      ><strong>{book.totalReservations}</strong>
                    </div>
                  </template>
                  <template if:false={analytics.reservationDemand}>
                    <div class="analytics-empty">
                      No reservation data available
                    </div>
                  </template>
                </div>
              </div>
            </template>
            <template if:false={analyticsAvailable}>
              <div class="empty">{analyticsMessage}</div>
            </template>
          </section>
          <c-library-librarian-closures></c-library-librarian-closures>
          <c-library-repair-cases></c-library-repair-cases>
        </template>

        <template if:true={isBooks}>
          <div class="toolbar top-actions-row">
            <div class="toolbar-buttons">
              <label class="file-button"
                >Import<input
                  type="file"
                  accept=".csv"
                  onchange={handleImport} /></label
              ><button class="button secondary" onclick={exportBooks}>
                Export</button
              ><button class="button primary" onclick={openAddBook}>
                ＋ Add Book
              </button>
            </div>
          </div>
          <div class="filter-row">
            <lightning-input
              variant="label-hidden"
              name="bookSearch"
              type="search"
              placeholder="Search by title, author, ISBN..."
              value={bookSearch}
              onchange={handleInput}
            ></lightning-input
            ><lightning-combobox
              variant="label-hidden"
              name="bookCategory"
              value={bookCategory}
              options={categoryFilterOptions}
              placeholder="Category"
              onchange={handleInput}
            ></lightning-combobox
            ><lightning-combobox
              variant="label-hidden"
              name="bookStatus"
              value={bookStatus}
              options={allStatusOptions}
              placeholder="Status"
              onchange={handleInput}
            ></lightning-combobox
            ><button class="button secondary" onclick={searchBooksNow}>
              Search
            </button>
          </div>
          <div class="table-card">
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>ISBN</th>
                    <th>Total Copies</th>
                    <th>Available</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={books} for:item="book"
                    ><tr key={book.Id}>
                      <td>
                        <button
                          class="text-link"
                          data-id={book.Id}
                          onclick={viewBook}
                        >
                          {book.Name}
                        </button>
                      </td>
                      <td>{book.authorNames}</td>
                      <td>{book.categoryNames}</td>
                      <td>{book.ISBN__c}</td>
                      <td>{book.Total_Copies__c}</td>
                      <td>{book.Available_Copies__c}</td>
                      <td>
                        <span class={book.statusClass}>{book.Status__c}</span>
                      </td>
                      <td>
                        <button
                          class="action-link"
                          data-id={book.Id}
                          onclick={openEditBook}
                        >
                          Edit
                        </button>
                      </td>
                    </tr></template
                  >
                </tbody>
              </table>
            </div>
            <template if:false={hasBooks}
              ><div class="empty">No books found</div></template
            >
            <div class="pagination">
              <span>Showing page {bookPage}</span>
              <div>
                <button
                  class="page-button"
                  onclick={previousBooks}
                  disabled={isFirstBookPage}
                >
                  ‹</button
                ><span class="page-current">{bookPage}</span
                ><button class="page-button" onclick={nextBooks}>›</button>
              </div>
            </div>
          </div>
        </template>

        <template if:true={isBookCopies}>
          <div class="toolbar top-actions-row">
            <button class="button primary" onclick={openAddCopy}>
              ＋ Add Copy
            </button>
          </div>
          <div class="filter-row copies-filter">
            <lightning-input
              variant="label-hidden"
              name="copySearch"
              type="search"
              placeholder="Search by book title, barcode..."
              value={copySearch}
              onchange={handleInput}
            ></lightning-input
            ><lightning-combobox
              variant="label-hidden"
              name="copyStatus"
              value={copyStatus}
              options={copyStatusOptions}
              placeholder="Status"
              onchange={handleInput}
            ></lightning-combobox
            ><lightning-combobox
              variant="label-hidden"
              name="copyLocation"
              value={copyLocation}
              options={copyLocationOptions}
              placeholder="Location"
              onchange={filterCopyLocation}
            ></lightning-combobox
            ><button class="button secondary" onclick={searchCopiesNow}>
              Search
            </button>
          </div>
          <div class="table-card">
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>Copy ID</th>
                    <th>Book Title</th>
                    <th>Barcode</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Condition</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={copies} for:item="copy"
                    ><tr key={copy.Id}>
                      <td><span class="text-link">{copy.Name}</span></td>
                      <td>{copy.bookName}</td>
                      <td>{copy.Barcode__c}</td>
                      <td>{copy.Shelf_Location__c}</td>
                      <td>
                        <span class={copy.statusClass}>{copy.Status__c}</span>
                      </td>
                      <td>{copy.Condition__c}</td>
                      <td>
                        <button
                          class="action-link"
                          data-id={copy.Id}
                          onclick={openEditCopy}
                        >
                          Edit
                        </button>
                      </td>
                    </tr></template
                  >
                </tbody>
              </table>
            </div>
            <template if:false={hasCopies}
              ><div class="empty">No book copies found</div></template
            >
            <div class="pagination">
              <span>Showing page {copyPage}</span>
              <div>
                <button
                  class="page-button"
                  onclick={previousCopies}
                  disabled={isFirstCopyPage}
                >
                  ‹</button
                ><span class="page-current">{copyPage}</span
                ><button class="page-button" onclick={nextCopies}>›</button>
              </div>
            </div>
          </div>
        </template>

        <template if:true={showMemberList}>
          <div class="toolbar members-toolbar">
            <div class="filter-row member-filters">
              <lightning-input
                variant="label-hidden"
                name="memberSearch"
                type="search"
                placeholder="Search by name, email, member ID..."
                value={memberSearch}
                onchange={handleInput}
              ></lightning-input
              ><lightning-combobox
                variant="label-hidden"
                name="memberStatus"
                value={memberStatus}
                options={memberStatusOptions}
                placeholder="Status"
                onchange={handleInput}
              ></lightning-combobox
              ><button class="button secondary" onclick={searchMembersNow}>
                Search
              </button>
            </div>
            <button class="button primary" onclick={openAddMember}>
              <span class="plus">＋</span> Add Member
            </button>
          </div>
          <div class="table-card">
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>Member ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Membership</th>
                    <th>Status</th>
                    <th>Join Date</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={members} for:item="member"
                    ><tr key={member.Id}>
                      <td><span class="text-link">{member.Name}</span></td>
                      <td>{member.fullName}</td>
                      <td>{member.Email__c}</td>
                      <td>{member.planName}</td>
                      <td>
                        <span class={member.statusClass}
                          >{member.Status__c}</span
                        >
                      </td>
                      <td>{member.Membership_Start_Date__c}</td>
                      <td>
                        <button
                          class="action-link"
                          data-id={member.Id}
                          onclick={viewMember}
                        >
                          View
                        </button>
                      </td>
                    </tr></template
                  >
                </tbody>
              </table>
            </div>
            <template if:false={hasMembers}
              ><div class="empty">No members found</div></template
            >
            <div class="pagination">
              <span
                >Showing {memberStart}–{memberEnd} of {memberCount}
                members</span
              >
              <div>
                <button
                  class="page-button"
                  onclick={previousMembers}
                  disabled={isFirstMemberPage}
                >
                  ‹
                </button>
                <span class="page-current">{memberPage}</span>
                <button
                  class="page-button"
                  onclick={nextMembers}
                  disabled={isLastMemberPage}
                >
                  ›
                </button>
              </div>
            </div>
          </div>
        </template>

        <template if:true={showMemberDetails}>
          <div class="member-detail-actions">
            <button class="button secondary" onclick={closeMemberDetail}>
              ← Members
            </button>
            <div>
              <button class="button secondary" onclick={openEditMember}>
                Edit
              </button>
              <template if:true={canSuspendSelectedMember}>
                <button
                  class="button secondary"
                  data-status="Suspended"
                  onclick={updateMemberAccountStatus}
                >
                  Suspend
                </button>
              </template>
              <template if:true={canActivateSelectedMember}>
                <button
                  class="button primary"
                  data-status="Active"
                  onclick={updateMemberAccountStatus}
                >
                  Activate
                </button>
              </template>
              <button
                class="button secondary"
                onclick={resetSelectedMemberPassword}
              >
                Reset Password
              </button>
            </div>
          </div>
          <section class="member-profile-card">
            <div class="member-profile-main">
              <div class="member-avatar member-avatar-large">
                {memberInitials}
              </div>
              <div class="member-identity">
                <div class="member-name-row">
                  <h2>{selectedMemberName}</h2>
                  <span class={selectedMemberStatusClass}
                    >{memberDetail.member.Account_Status__c}</span
                  >
                </div>
                <p>▣ Member ID: {memberDetail.member.Name}</p>
                <p>✉ {memberDetail.member.Email__c}</p>
                <p>⌕ {memberDetail.member.Phone__c}</p>
                <p>◷ Joined: {memberDetail.member.Registration_Date__c}</p>
              </div>
            </div>
            <aside class="membership-summary">
              <span>Membership</span>
              <strong>{memberDetail.member.Membership_Plan__r.Name}</strong>
              <small
                >Valid till {memberDetail.member.Membership_End_Date__c}</small
              >
              <button class="button primary" onclick={renewSelectedMember}>
                Renew
              </button>
            </aside>
          </section>
          <nav class="member-tabs" aria-label="Member information">
            <template for:each={memberTabs} for:item="tab">
              <button
                key={tab.value}
                class={tab.className}
                data-value={tab.value}
                onclick={selectMemberTab}
              >
                {tab.label}
              </button>
            </template>
          </nav>
          <template if:true={isMemberOverview}>
            <div class="member-overview-grid">
              <article>
                <span>Active Loans</span><strong>{activeMemberLoans}</strong
                ><button
                  data-value="Borrowing History"
                  onclick={selectMemberTab}
                >
                  View Details
                </button>
              </article>
              <article>
                <span>Reservations</span
                ><strong>{selectedMemberReservations}</strong
                ><button data-value="Reservations" onclick={selectMemberTab}>
                  View Details
                </button>
              </article>
              <article>
                <span>Outstanding Fines</span
                ><strong class="fine-value">{selectedMemberOutstanding}</strong
                ><button data-value="Fines" onclick={selectMemberTab}>
                  View Details
                </button>
              </article>
              <article>
                <span>Total Books Borrowed</span
                ><strong>{selectedMemberBorrowed}</strong
                ><button
                  data-value="Borrowing History"
                  onclick={selectMemberTab}
                >
                  View Details
                </button>
              </article>
            </div>
          </template>
          <template if:true={isMemberLoans}>
            <div class="table-card member-tab-panel">
              <div class="table-scroll">
                <table>
                  <thead>
                    <tr>
                      <th>Transaction ID</th>
                      <th>Book</th>
                      <th>Issue Date</th>
                      <th>Due Date</th>
                      <th>Return Date</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={memberDetail.loans} for:item="row"
                      ><tr key={row.Id}>
                        <td class="text-link">{row.Name}</td>
                        <td>{row.Book_Copy__r.Book__r.Name}</td>
                        <td>{row.Borrow_Date__c}</td>
                        <td>{row.Due_Date__c}</td>
                        <td>{row.Return_Date__c}</td>
                        <td>{row.Status__c}</td>
                      </tr></template
                    >
                  </tbody>
                </table>
              </div>
            </div>
          </template>
          <template if:true={isMemberReservations}>
            <div class="table-card member-tab-panel">
              <div class="table-scroll">
                <table>
                  <thead>
                    <tr>
                      <th>Reservation ID</th>
                      <th>Book</th>
                      <th>Reserved On</th>
                      <th>Queue Position</th>
                      <th>Status</th>
                    </tr>
                  </thead>

                  checked={settings.allowSelfRegistration}
                  onchange={handleInput}
                ></lightning-input>
                <lightning-input
                  name="settings.requireEmailVerification"
                  type="checkbox"
                  label="Require Email Verification"
                  checked={settings.requireEmailVerification}
                  onchange={handleInput}
                ></lightning-input>
                <lightning-input
                  name="settings.finePaymentEnabled"
                  type="checkbox"
                  label="Enable Fine Collection"
                  checked={settings.finePaymentEnabled}
                  onchange={handleInput}
                ></lightning-input>
              </div>
            </article>
          </section>

          <section class="settings-tools panel">
            <div class="settings-tools-heading">
              <div>
                <h2>Operational Tools</h2>
                <p>Open common administration areas or run maintenance now.</p>
              </div>
              <span class="security-note">Permission protected</span>
            </div>
            <div class="settings-actions">
              <button
                class="button secondary"
                data-section="Memberships"
                onclick={openSettingsSection}
              >
                Manage Membership Plans
              </button>
              <button
                class="button secondary"
                data-section="Registrations"
                onclick={openSettingsSection}
              >
                Review Registrations
              </button>
              <button
                class="button secondary"
                data-section="Fines"
                onclick={openSettingsSection}
              >
                Manage Fines
              </button>
              <button class="button secondary" onclick={processExpired}>
                Process Expired Holds
              </button>
            </div>
          </section>
        </template>
      </main>
    </div>
  </div>

  <template if:true={showBookModal}>
    <section
      class="modal book-page-modal"
      role="dialog"
      aria-modal="true"
      aria-label={modalTitle}
    >
      <div class="modal-card book-modal book-page-card">
        <header>
          <div>
            <h2>{modalTitle}</h2>
            <p>Enter book details and save to the library</p>
          </div>
          <button class="modal-close" onclick={closeModals}>×</button>
        </header>
        <div class="modal-body book-form">
          <div class="form-fields">
            <lightning-input
              class="book-field"
              name="book.title"
              label="Title"
              value={bookForm.title}
              onchange={handleInput}
              required
            ></lightning-input
            ><lightning-combobox
              class="book-field"
              name="primaryAuthor"
              label="Author"
              placeholder="Select an author"
              options={authorOptions}
              value={primaryAuthorId}
              onchange={handlePrimaryAuthor}
              required
            ></lightning-combobox
            ><lightning-input
              class="book-field"
              name="book.isbn"
              label="ISBN"
              value={bookForm.isbn}
              onchange={handleInput}
              required
            ></lightning-input
            ><lightning-combobox
              class="book-field"
              name="primaryCategory"
              label="Category"
              placeholder="Select a category"
              options={categoryOptions}
              value={primaryCategoryId}
              onchange={handlePrimaryCategory}
              required
            ></lightning-combobox>
            <div class="two-cols">
              <lightning-input
                name="book.publisher"
                label="Publisher"
                value={bookForm.publisher}
                onchange={handleInput}
              ></lightning-input
              ><lightning-input
                name="book.publicationYear"
                type="number"
                label="Publication Year"
                value={bookForm.publicationYear}
                onchange={handleInput}
              ></lightning-input>
            </div>
            <div class="two-cols">
              <lightning-input
                name="book.edition"
                label="Edition"
                value={bookForm.edition}
                onchange={handleInput}
              ></lightning-input
              ><lightning-input
                name="book.language"
                label="Language"
                value={bookForm.language}
                onchange={handleInput}
              ></lightning-input>
            </div>
            <lightning-textarea
              name="book.description"
              label="Description"
              value={bookForm.description}
              onchange={handleInput}
            ></lightning-textarea>
          </div>
          <aside class="cover-preview">
            <span>Book Cover</span>
            <div class="cover-art">
              <template if:true={hasBookCover}
                ><img
                  src={bookForm.coverUrl}
                  alt="Book cover preview" /></template
              ><template if:false={hasBookCover}
                ><lightning-icon
                  icon-name="utility:knowledge_base"
                  size="large"
                ></lightning-icon
                ><strong>{bookForm.title}</strong></template
              >
            </div>
            <button
              class="button secondary change-cover"
              onclick={focusCoverUrl}
            >
              Change Cover
            </button>
            <lightning-input
              class="cover-url"
              name="book.coverUrl"
              label="Cover Image URL"
              value={bookForm.coverUrl}
              onchange={handleInput}
            ></lightning-input>
          </aside>
        </div>
        <footer>
          <button class="button secondary" onclick={closeModals}>Cancel</button
          ><button class="button primary" onclick={saveBook}>
            {bookSaveLabel}
          </button>
        </footer>
      </div>
    </section>
    <div class="backdrop book-page-backdrop"></div>
  </template>

  <template if:true={showCopyModal}>
    <section
      class="modal"
      role="dialog"

      <div class="modal-card">

            class="copy-field"

          ></lightning-input
          ><lightning-input

          ></lightning-input
          ><lightning-input

  <template if:true={showReservationModal}>

        <header>
          <div>

            <p>{selectedReservation.Name}</p>
          </div>
          <button class="modal-close" onclick={closeModals}>×</button>
        </header>
        <div class="modal-body registration-detail-grid">
          <div>
            <span>Member</span><strong>{selectedReservation.memberName}</strong>
          </div>
          <div>
            <span>Book Title</span
            ><strong>{selectedReservation.bookName}</strong>
          </div>
          <div>
            <span>Reserved On</span

          <div>
            <span>Status</span
            ><strong>{selectedReservation.displayStatus}</strong>
          </div>
          <div>
            <span>Queue Position</span
            ><strong>{selectedReservation.queuePosition}</strong>
          </div>
          <div>
            <span>Expires On</span
            ><strong>{selectedReservation.Expiry_Date__c}</strong>
          </div>
          <div>
            <span>Estimated Availability</span
            ><strong>{selectedReservation.etaDateLabel}</strong>
          </div>
          <div>
            <span>ETA Confidence</span

          </div>
          <div>
            <span>ETA Explanation</span

          </div>

          <button class="button secondary" onclick={closeModals}>Close</button>

            >
              Prepare for Pickup
            </button></template
          >
          <template if:true={selectedReservation.canIssue}
            ><button
              class="button primary issue-reservation-button"
              onclick={issueReadyReservation}
            >
              ＋ Issue Book
            </button></template
          >
          <template if:true={selectedReservation.canCancel}
            ><button
              class="button danger"
              data-id={selectedReservation.Id}
              onclick={cancelReservationNow}

              Cancel Reservation

  <template if:true={showFineModal}>
    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-label="Collect fine"
    >
      <div class="modal-card fine-modal-card">
        <header>
          <div>
            <h2>Collect Fine</h2>
            <p>{selectedFine.Name} · {selectedFine.memberName}</p>
          </div>
          <button class="modal-close" onclick={closeModals}>×</button>
        </header>
        <div class="modal-body fine-collection-form">
          <div class="fine-summary">
            <span>Related Transaction</span
            ><strong>{selectedFine.loanName}</strong>
          </div>
          <div class="fine-summary">
            <span>Outstanding Amount</span
            ><strong>{selectedFine.amountLabel}</strong>
          </div>
          <lightning-input
            name="paymentAmount"
            type="number"
            min="0.01"
            label="Payment Amount"
            value={paymentAmount}
            onchange={handleInput}
            required
          ></lightning-input>
          <lightning-input
            name="waiverReason"
            label="Waiver Reason (optional)"
            value={waiverReason}
            onchange={handleInput}
          ></lightning-input>
        </div>
        <footer>
          <button class="button secondary" onclick={closeModals}>Cancel</button>
          <button class="button danger" onclick={waiveSelectedFine}>
            Waive Fine
          </button>
          <button class="button primary" onclick={payFine}>
            Record Payment
          </button>
        </footer>
      </div>
    </section>
    <div class="backdrop"></div>
  </template>
