<template>
  <article class="book-card">
    <div class="cover-wrap">
      <c-library-book-cover
        title={book.Name}
        author={book.authors}
        cover-url={book.coverUrl}
      ></c-library-book-cover>
    </div>
    <div class="book-content">
      <h3 title={book.Name}>{book.Name}</h3>
      <p class="author" title={book.authors}>{book.authors}</p>
      <p class="category" title={book.categories}>{book.categories}</p>
      <span class={book.availabilityClass}>{book.availabilityMeta}</span>
    </div>
    <button class="view-button" onclick={handleAction}>{actionLabel}</button>
  </article>
</template>
