<template>
  <div class="page">
    <div class="frame">
      <c-library-auth-nav></c-library-auth-nav>
      <section class="state-wrap">
        <div class="state-card">
          <div class={iconClass}>{icon}</div>
          <h1>{title}</h1>
          <p>{message}</p>
          <template if:true={hasActionUrl}
            ><a class="action" href={actionUrl}>{actionLabel}</a></template
          >
          <template if:false={hasActionUrl}
            ><button class="action" onclick={handleAction}>
              {actionLabel}
            </button></template
          >
        </div>
      </section>
    </div>
  </div>
</template>
