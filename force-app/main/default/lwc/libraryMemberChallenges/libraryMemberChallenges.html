<template>
  <section class="challenge-page" aria-label="Reading challenges">
    <div class="challenge-header">
      <div>
        <p class="eyebrow">Keep turning pages</p>
        <h2>Reading challenges</h2>
        <p>
          Set a goal, track your borrowing progress, and celebrate completion.
        </p>
      </div>
      <button type="button" class="refresh" onclick={refresh}>Refresh</button>
    </div>
    <template if:true={loading}
      ><div class="loading">Loading challenges…</div></template
    >
    <template if:true={error}
      ><div class="error" role="alert">{error}</div></template
    >
    <template if:true={hasAchievements}>
      <section class="achievement-strip" aria-label="Earned badges">
        <div>
          <strong>Your achievements</strong
          ><small>Certificates are available for completed challenges.</small>
        </div>
        <template for:each={achievements} for:item="achievement">
          <a
            key={achievement.id}
            class="badge"
            href={achievement.certificateUrl}
            target="_blank"
            rel="noopener"
            >🏅 {achievement.badgeName}</a
          >
        </template>
      </section>
    </template>
    <label class="leaderboard-toggle"
      ><input
        type="checkbox"
        checked={leaderboardOptIn}
        onchange={toggleLeaderboard}
      />
      Opt in to anonymous challenge leaderboards</label
    >
    <template if:true={hasRows}
      ><div class="challenge-list">
        <template for:each={rows} for:item="row"
          ><article class="challenge-card" key={row.id}>
            <div>
              <h3>{row.name}</h3>
              <p>{row.description}</p>
              <span>{row.startAt} – {row.endAt}</span>
              <div class="progress">
                <span style={row.progressStyle}></span>
              </div>
              <small>{row.progressCount} of {row.goalCount} books</small>
              <template if:true={row.streakCount}
                ><small class="streak"
                  >🔥 {row.streakCount}-day streak</small
                ></template
              >
            </div>
            <div class="challenge-action">
              <template if:true={row.enrollmentStatus}
                ><strong>{row.enrollmentStatus}</strong
                ><button
                  type="button"
                  class="secondary"
                  data-id={row.id}
                  onclick={leave}
                >
                  Leave
                </button></template
              ><template if:false={row.enrollmentStatus}
                ><button
                  type="button"
                  class="primary"
                  data-id={row.id}
                  onclick={enroll}
                >
                  Join challenge
                </button></template
              >
              <button
                type="button"
                class="secondary leaderboard-button"
                data-id={row.id}
                onclick={viewLeaderboard}
              >
                Leaderboard
              </button>
            </div>
          </article></template
        >
      </div></template
    >
    <template if:false={hasRows}
      ><div class="empty">
        There are no active reading challenges right now.
      </div></template
    >
    <template if:true={leaderboardChallenge}>
      <section class="leaderboard" aria-label="Challenge leaderboard">
        <h3>{leaderboardTitle}</h3>
        <template if:true={hasLeaderboard}
          ><ol>
            <template for:each={leaderboard} for:item="entry"
              ><li key={entry.alias}>
                <span>#{entry.rank} {entry.alias}</span
                ><strong>{entry.progressCount} books</strong>
              </li></template
            >
          </ol></template
        >
        <template if:false={hasLeaderboard}
          ><p>
            No opted-in readers have progress for this challenge yet.
          </p></template
        >
      </section>
    </template>
  </section>
</template>
