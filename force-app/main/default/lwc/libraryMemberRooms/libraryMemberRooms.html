<template>
  <section class="rooms-page" aria-label="Study room seats">
    <div class="rooms-header">
      <div>
        <p class="eyebrow">Quiet spaces</p>
        <h2>Reserve a seat</h2>
        <p>Pick a time, choose a room, then reserve a seat.</p>
      </div>
    </div>
    <template if:true={hasForecast}>
      <section class="forecast" aria-label="Busy times">
        <div class="forecast-head">
          <div>
            <span class="eyebrow">✦ Busy times</span>
            <h3>When are the rooms busiest?</h3>
            <p class="forecast-sub">
              Based on past bookings, so you can pick a time that suits you.
            </p>
          </div>
          <div class={expectedClass}>
            <span class="dot"></span>
            <span>{expectedLabel}</span>
          </div>
        </div>
        <div class="forecast-grid">
          <div class="forecast-card">
            <h4>By hour</h4>
            <div class="chart" role="img" aria-label="Busy times by hour">
              <template for:each={forecastHours} for:item="bar">
                <div class="col" key={bar.key} title={bar.title}>
                  <div class="track">
                    <div class={bar.className} style={bar.barStyle}></div>
                  </div>
                  <span class="tick">{bar.label}</span>
                </div>
              </template>
            </div>
          </div>
          <div class="forecast-card">
            <h4>By day</h4>
            <div class="chart" role="img" aria-label="Busy times by day">
              <template for:each={forecastDays} for:item="bar">
                <div class="col" key={bar.key} title={bar.title}>
                  <div class="track">
                    <div class={bar.className} style={bar.barStyle}></div>
                  </div>
                  <span class="tick">{bar.label}</span>
                </div>
              </template>
            </div>
          </div>
        </div>
        <template if:true={hasBestTimes}>
          <div class="best">
            <strong>Best times to book:</strong>
            <template for:each={bestTimes} for:item="time">
              <span class="pill" key={time}>{time}</span>
            </template>
          </div>
        </template>
        <template if:true={hasTips}>
          <ul class="tips">
            <template for:each={forecastTips} for:item="tip">
              <li key={tip.key}>{tip.text}</li>
            </template>
          </ul>
        </template>
      </section>
    </template>
    <template if:true={forecastEmpty}>
      <div class="notice forecast-empty">
        <span>✦</span> Busy-time guidance will appear once there are more room
        bookings.
      </div>
    </template>
    <div class="search-card">
      <div class="search-field">
        <label for="startAt">Starts</label>
        <input
          id="startAt"
          type="datetime-local"
          name="startAt"
          value={startAt}
          onchange={handleInput}
        />
      </div>
      <div class="search-field">
        <label for="endAt">Ends</label>
        <input
          id="endAt"
          type="datetime-local"
          name="endAt"
          value={endAt}
          onchange={handleInput}
        />
      </div>
      <div class="search-field">
        <label for="minimumCapacity">Minimum seats</label>
        <input
          id="minimumCapacity"
          type="number"
          name="minimumCapacity"
          min="1"
          value={minimumCapacity}
          onchange={handleInput}
        />
      </div>
      <div class="search-field">
        <label for="purpose">Purpose</label>
        <input
          id="purpose"
          type="text"
          name="purpose"
          value={purpose}
          onchange={handleInput}
          placeholder="Optional"
        />
      </div>
      <button type="button" class="primary" onclick={search}>Find rooms</button>
    </div>
    <template if:true={loading}
      ><div class="loading">Checking availability…</div></template
    >
    <template if:true={error}
      ><div class="error" role="alert">{error}</div></template
    >
    <div class="room-list">
      <template for:each={rooms} for:item="room">
        <article class="room-card" key={room.id}>
          <div>
            <h3>{room.name}</h3>
            <span>{room.details}</span>
            <span class="tag">{room.typeLabel}</span>
            <span>{room.seatSummary}</span>
          </div>
          <button
            type="button"
            class="primary"
            data-id={room.id}
            onclick={chooseRoom}
            disabled={room.disabled}
          >
            {room.chooseLabel}
          </button>
        </article>
      </template>
      <template if:false={hasRooms}>
        <p class="empty">No rooms match this time.</p>
      </template>
    </div>
    <template if:true={selectedRoom}>
      <section class="seat-panel" aria-label="Seat map">
        <h3>{seatPanelTitle}</h3>
        <template if:true={loadingSeats}
          ><div class="loading">Loading seats…</div></template
        >
        <template if:false={selectedIsPrivate}>
          <div class="seat-grid">
            <template for:each={seatItems} for:item="seat">
              <button
                type="button"
                key={seat.seatNo}
                class={seat.className}
                data-number={seat.seatNo}
                aria-label={seat.label}
                aria-pressed={seat.pressed}
                disabled={seat.taken}
                onclick={chooseSeat}
              >
                {seat.seatNo}
              </button>
            </template>
          </div>
          <div class="seat-legend">
            <span class="swatch free"></span>Free
            <span class="swatch selected"></span>Selected
            <span class="swatch taken"></span>Taken
          </div>
        </template>
        <template if:true={selectedIsPrivate}>
          <p class="private-note">
            This is a private single-person room. Booking it reserves the whole
            room for your chosen time.
          </p>
        </template>
        <button
          type="button"
          class="primary"
          onclick={reserve}
          disabled={reserveDisabled}
        >
          {reserveLabel}
        </button>
      </section>
    </template>
    <section class="bookings" aria-label="My seat reservations">
      <h3>My reservations</h3>
      <template for:each={bookings} for:item="booking">
        <article class="booking-row" key={booking.id}>
          <div>
            <strong>{booking.roomName} · Seat {booking.seatNumber}</strong
            ><span>{booking.when}</span><span>{booking.purpose}</span>
          </div>
          <button
            type="button"
            class="secondary"
            data-id={booking.id}
            onclick={cancel}
          >
            Cancel
          </button>
        </article>
      </template>
      <template if:false={hasBookings}
        ><p class="empty">You have no seat reservations.</p></template
      >
    </section>
  </section>
</template>
